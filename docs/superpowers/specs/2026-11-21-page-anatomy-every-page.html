<title>Every Page, Revised B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a page index on the left, one app-frame mockup on the right. Single light theme on purpose:
   the app being mocked is light-only (sand surfaces, coral action colour). */
:root{
  color-scheme:light;
  --page:#FBF7F1; --card:#FFFEFC; --subtle:#FDFBF8; --muted:#F6EFE6;
  --edge:#EFE7DC; --edge-strong:#E3D8C9;
  --text:#1B1A18; --text2:#57534E; --text3:#78716C;
  --coral:#C2533A; --coral-hover:#A8412C;
  --danger:#B42318; --danger-bg:#FEF3F2; --danger-edge:#FECDCA;
  --warn:#B45309; --warn-bg:#FFFAEB; --warn-edge:#FDE7B0;
  --info:#1C5A52; --info-bg:#EFF8F6; --info-edge:#C5E4DE;
  --ok:#157F3C; --ok-bg:#EFFAF2; --ok-edge:#BFE6CB;
  --neutral:#57534E; --neutral-bg:#F4F1EC; --neutral-edge:#E3D8C9;
  --bench:#EEE7DC;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --e1:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bench);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3,h4,h5,p{margin:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.app{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.top p{color:var(--text2);font-size:14px;margin-top:4px}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tally span{font-size:12px;border:1px solid var(--edge-strong);border-radius:999px;padding:2px 8px;background:var(--card);color:var(--text2)}
.index{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
@media(max-width:900px){.index{position:static;max-height:none}.index nav{display:none}}
.index input,.index select{font:inherit;font-size:14px;height:36px;border:1px solid var(--edge-strong);border-radius:6px;padding:0 10px;background:var(--card);color:var(--text);width:100%}
.index select{display:none}@media(max-width:900px){.index select{display:block}.index input{display:none}}
.index h2{font-size:12px;font-weight:500;color:var(--text3);margin:10px 0 4px}
.index a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;color:var(--text);text-decoration:none;padding:5px 8px;border-radius:6px}
.index a:hover{background:var(--muted)}
.index a[aria-current="true"]{background:var(--card);box-shadow:var(--e1);font-weight:500}
.index a i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text3)}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.route{font-family:var(--mono);font-size:13px;color:var(--text2);overflow-wrap:anywhere}
.seg{display:inline-flex;background:var(--muted);border:1px solid var(--edge-strong);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:14px;font-weight:500;color:var(--text2);background:transparent;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--e1)}
.seg button:disabled{opacity:.45;cursor:default}
.note{font-size:14px;color:var(--text2);border-left:2px solid var(--text);padding-left:10px;max-width:90ch}
.note b{color:var(--text);font-weight:600}

.frame{background:var(--page);border:1px solid var(--edge-strong);border-radius:12px;overflow:hidden;box-shadow:0 12px 32px rgba(60,40,20,.10)}
.crumbs{font-size:13px;color:var(--text3);padding:12px 24px;border-bottom:1px solid var(--edge)}
.crumbs b{color:var(--text);font-weight:500}
.body{padding:20px 24px 32px;display:flex;flex-direction:column;gap:20px;min-width:0;min-height:480px}
@container pg (max-width:560px){.body{padding:16px}.crumbs{padding:10px 16px}}

.btn{font:inherit;font-size:14px;font-weight:500;border-radius:8px;height:32px;padding:0 12px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--coral);color:#fff}
.btn.outline{background:var(--card);border-color:var(--edge-strong);color:var(--text)}
.btn.danger{background:var(--card);border-color:var(--danger-edge);color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 8px 2px 6px;border:1px solid;white-space:nowrap}
.badge svg,.ico svg{flex:none}.badge svg{width:12px;height:12px}
.t-danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-edge)}
.t-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-edge)}
.t-info{color:var(--info);background:var(--info-bg);border-color:var(--info-edge)}
.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-edge)}
.t-neutral{color:var(--neutral);background:var(--neutral-bg);border-color:var(--neutral-edge)}
.num{font-variant-numeric:tabular-nums}
.link{color:var(--coral-hover);font-weight:500;text-decoration:none}

.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
.head h3{font-size:20px;font-weight:600;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head p{color:var(--text2);font-size:14px;max-width:64ch;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-areas:"main top" "main rest";grid-template-rows:auto 1fr;column-gap:20px;align-items:start}
.grid.solo{grid-template-columns:minmax(0,1fr);grid-template-areas:"main"}
.grid.narrowmain .mainc{max-width:720px}
.mainc{grid-area:main;min-width:0;display:flex;flex-direction:column;gap:16px}
.ptop{grid-area:top;background:var(--card);border:1px solid var(--edge);border-radius:8px 8px 0 0}
.prest{grid-area:rest;background:var(--card);border:1px solid var(--edge);border-top:0;border-radius:0 0 8px 8px}
.ptop.only{border-radius:8px}
@container pg (max-width:1000px){.grid{grid-template-columns:1fr;grid-template-areas:"top" "main" "rest";row-gap:16px}.ptop,.prest{border-radius:8px;border-top:1px solid var(--edge)}}
.grp{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.grp+.grp{border-top:1px solid var(--edge)}
.grp h4{font-size:12px;font-weight:500;color:var(--text3)}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.big small{font-size:14px;font-weight:400;color:var(--text3);letter-spacing:0}
.kv{display:flex;justify-content:space-between;font-size:14px;gap:12px}.kv span:first-child{color:var(--text2)}.kv span:last-child{text-align:right}
.attn{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-edge);border-radius:6px;padding:10px;font-size:14px}
.attn svg{width:16px;height:16px;flex:none;color:var(--warn);margin-top:2px}
.attn b{font-weight:500;display:block}
.go{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--text);text-decoration:none;padding:3px 0}
.go svg{width:14px;height:14px;color:var(--text3);flex:none}
.about{font-size:13px;color:var(--text2)}
.pv{border:1px solid var(--edge);border-radius:6px;background:var(--subtle);padding:10px;font-size:13px;color:var(--text2)}
.pv b{display:block;color:var(--text);font-weight:500;font-size:14px}

.sec{background:var(--card);border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.sec-h{padding:12px 16px;border-bottom:1px solid var(--edge)}
.sec-h h4{font-size:15px;font-weight:600}.sec-h p{font-size:13px;color:var(--text2)}
.tools{display:flex;flex-wrap:nowrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--edge)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none}.chip{white-space:nowrap;flex:none}
.chip{font-size:13px;border:1px solid var(--edge-strong);border-radius:999px;padding:3px 10px;color:var(--text2);background:var(--card)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip .num{opacity:.7;margin-left:4px}
.search{font:inherit;font-size:14px;height:32px;border:1px solid var(--edge-strong);border-radius:6px;padding:0 10px;background:var(--card);color:var(--text);width:220px;max-width:45%;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-f{align-items:center;padding:10px 16px;border-top:1px solid var(--edge);background:var(--subtle);font-size:13px;color:var(--text3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-top:1px solid var(--edge);align-items:center}
.item.first{border-top:0}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid}.ico svg{width:16px;height:16px}
.item h5{font-size:15px;font-weight:600}
.item p{font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:13px;color:var(--text3);margin-top:2px}
.out{font-size:13px;color:var(--text2);text-align:right;max-width:260px}
.out.bad{color:var(--warn);font-weight:500}
@container pg (max-width:460px){.item{grid-template-columns:32px minmax(0,1fr)}.out{grid-column:2;text-align:left}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{text-align:left;font-weight:500;color:var(--text3);font-size:12px;padding:0 16px;height:32px;white-space:nowrap}
td{padding:0 16px;height:44px;border-top:1px solid var(--edge);white-space:nowrap;color:var(--text2)}
td:first-child{color:var(--text);font-weight:500;white-space:normal;min-width:168px}th,td{padding-left:12px;padding-right:12px}th:first-child,td:first-child{padding-left:16px}td.act{color:var(--coral-hover);font-weight:500}td.act .btn{height:28px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px;padding:16px}
.fields dt{font-size:12px;color:var(--text3)}.fields dd{margin:2px 0 0;font-size:14px}
.prose{padding:16px;font-size:14px;color:var(--text2);max-width:70ch}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
.fld .hint{font-size:13px;color:var(--text3);margin-top:4px}
.inp{border:1px solid var(--edge-strong);border-radius:6px;background:var(--card);min-height:32px;padding:5px 10px;font-size:14px;color:var(--text2);max-width:520px}
.inp.area{min-height:84px}
.inp.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:280px}.inp.sel svg{width:14px;height:14px;flex:none;color:var(--text3);transform:rotate(90deg)}
.radio{display:flex;gap:8px;flex-wrap:wrap}.opt{display:inline-flex;align-items:center;gap:8px;font-size:14px;border:1px solid var(--edge-strong);border-radius:8px;padding:6px 12px 6px 10px;background:var(--card);color:var(--text2)}.opt i{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--edge-strong);flex:none}.opt.on{border-color:var(--text);color:var(--text);font-weight:500}.opt.on i{border:4px solid var(--text)}
.srow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--edge)}
.srow.first{border-top:0}
.srow b{display:block;font-size:15px;font-weight:500}.srow span.d{font-size:13px;color:var(--text2)}
.tog{width:36px;height:20px;border-radius:99px;background:var(--edge-strong);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:#fff}
.tog.on{background:var(--coral)}.tog.on::after{left:18px}
.val{font-size:14px;color:var(--text2);text-align:right}
.empty{padding:28px 24px 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty h5{font-size:17px;font-weight:600;letter-spacing:-.01em}
.empty p{color:var(--text2);font-size:14px;max-width:52ch}
.ghost{margin:0 16px 16px;border:1px dashed var(--edge-strong);border-radius:8px;background:var(--subtle)}
.ghost .tag{font-size:12px;color:var(--text3);padding:8px 16px 0;display:block}
.ghost td{border-top:0}.ghost table{min-width:440px}
.bespoke{border:1px dashed var(--edge-strong);border-radius:8px;padding:40px 24px;text-align:center;color:var(--text2);background:var(--subtle)}
.bespoke b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.setnav{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:start}
.setnav nav{display:flex;flex-direction:column;gap:2px;font-size:14px}
.setnav nav span{padding:6px 10px;border-radius:6px;color:var(--text2)}
.setnav nav span.on{background:var(--muted);color:var(--text);font-weight:500}
@container pg (max-width:620px){.setnav{grid-template-columns:1fr}.setnav nav{flex-direction:row;flex-wrap:wrap}}
.gt{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
.pager{display:flex;justify-content:space-between;gap:8px}

/* structure added after the fit test: page tabs, steps, card records */
.ptabs{display:flex;gap:20px;border-bottom:1px solid var(--edge-strong);overflow-x:auto;margin-top:-4px}
.ptabs span{font-size:14px;font-weight:500;color:var(--text2);padding:8px 0;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.ptabs span.on{color:var(--text);border-bottom-color:var(--coral)}
.ptabs em{font-style:normal;font-size:12px;color:var(--text3);background:var(--muted);border-radius:99px;padding:0 6px}
.steps{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center;font-size:14px;color:var(--text3)}
.steps span{display:inline-flex;align-items:center;gap:8px}
.steps b{width:22px;height:22px;border-radius:99px;border:1px solid var(--edge-strong);display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--card);color:var(--text2)}
.steps .done b{background:var(--ok-bg);border-color:var(--ok-edge);color:var(--ok)}
.steps .on{color:var(--text);font-weight:500}.steps .on b{background:var(--text);border-color:var(--text);color:#fff}
.steps i{width:28px;height:1px;background:var(--edge-strong);margin:0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:16px}
.rc{border:1px solid var(--edge);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card);min-width:0}
.rc h5{font-size:15px;font-weight:600}
.rc p{font-size:14px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .m{font-size:13px;color:var(--text3)}
.rc .f{margin-top:auto;padding-top:10px;border-top:1px solid var(--edge);display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2)}
.rc .f.bad{color:var(--warn);font-weight:500}
.who{display:inline-flex;align-items:center;gap:8px}
.av{display:none}
.meter{display:none}

/* REFINED LOOK: same structure, same colours, more craft. Scoped to .rf so the two can be compared. */
.rf .head{padding-bottom:16px;border-bottom:1px solid var(--edge)}
.rf .head:has(+ .ptabs){border-bottom:0;padding-bottom:0}
.rf .head h3{font-size:24px;letter-spacing:-.025em;line-height:1.2}
.rf .head p{font-size:15px;margin-top:4px}
.rf .btn{transition:background-color .12s,border-color .12s,transform .12s}
.rf .btn:active{transform:translateY(1px)}
.rf .btn.outline:hover{background:var(--muted)}
.rf .btn.primary:hover{background:var(--coral-hover)}
.rf .ptop,.rf .prest{background:transparent;border:0;border-left:1px solid var(--edge-strong);border-radius:0}
.rf .grp{padding:4px 0 16px 20px}.rf .grp+.grp{border-top:0;padding-top:12px}
.rf .prest .grp:first-child{padding-top:12px}
.rf .grp h4{letter-spacing:.01em}
.rf .big{font-size:32px;letter-spacing:-.03em}
.rf .big small{display:block;margin-top:2px}
.rf .meter{display:block;height:6px;border-radius:99px;background:var(--muted);overflow:hidden}
.rf .meter span{display:block;height:100%;background:var(--info);border-radius:99px}
.rf .kv{padding:4px 0;border-top:1px solid var(--edge)}.rf .kv span:last-child{color:var(--text);font-weight:500}
.rf .go{padding:5px 8px;margin:0 -8px;border-radius:6px;transition:background-color .12s}.rf .go:hover{background:var(--muted)}
@container pg (max-width:1000px){.rf .ptop,.rf .prest{border-left:0;border-top:1px solid var(--edge-strong)}.rf .grp{padding-left:0;padding-top:12px}}
.rf .tools{padding:0 16px;gap:0 12px;min-height:44px;align-items:center}.tools .chips:empty{display:none}.tools .chips:empty+.search{margin-left:auto}
.rf .chips{gap:18px}
.rf .chip{border:0;border-radius:0;background:transparent;padding:10px 0;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.rf .chip.on{background:transparent;color:var(--text);border-bottom-color:var(--text)}
.rf .chip .num{opacity:1;font-size:12px;color:var(--text3);background:var(--muted);border-radius:99px;padding:0 6px;margin-left:6px}
.rf .search{height:30px;background:var(--subtle)}
.rf .sec-h h4{font-size:14px}
.rf th{background:var(--subtle);border-bottom:1px solid var(--edge);height:34px;letter-spacing:.01em}
.rf td{height:42px}
.rf tbody tr{transition:background-color .12s}.rf tbody tr:hover{background:var(--subtle)}
.rf tbody tr:first-child td{border-top:0}
.rf td.n,.rf th.n{text-align:right;font-family:var(--mono);font-size:13px}
.rf th.n{font-family:var(--sans);font-size:12px}
.rf .av{display:grid;place-items:center;width:24px;height:24px;border-radius:99px;background:var(--muted);border:1px solid var(--edge-strong);font-size:10px;font-weight:600;color:var(--text2);flex:none;letter-spacing:.02em}
.rf .item{transition:background-color .12s;cursor:default}.rf .item:hover{background:var(--subtle)}
.rf .ico{width:28px;height:28px;border-radius:99px}.rf .ico svg{width:14px;height:14px}
.rf .item{grid-template-columns:28px minmax(0,1fr) auto}
.rf .item h5{font-weight:500}
.rf .out{font-size:13px}
.rf .rc{transition:border-color .12s}.rf .rc:hover{border-color:var(--edge-strong)}
.rf .rc h5{font-weight:500}
.rf .fields dd{font-weight:500}
.rf .inp{background:var(--subtle)}
.rf .srow b{font-size:14px}
.rf .gt{font-size:13px;font-weight:500;color:var(--text3);letter-spacing:.01em;margin-top:8px}
.rf .sec-f{background:transparent;font-size:12px}
@media(prefers-reduced-motion:reduce){.rf *{transition:none!important}}

/* always-on pieces added with the signature pass (they are structure, not styling) */
.due{display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;color:var(--text2)}
.due b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--text)}
.pips{display:inline-flex;gap:2px}.pips i{width:5px;height:12px;border-radius:2px;background:var(--edge-strong)}
.due.calm .pips i.f{background:var(--info)}.due.aware .pips i.f{background:#C98A1B}.due.urgent .pips i.f{background:var(--warn)}.due.critical .pips i.f{background:var(--danger)}
.due.critical b{color:var(--danger)}.due.urgent b{color:var(--warn)}
.prog{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.prog u{display:inline-block;width:56px;height:6px;border-radius:99px;background:var(--muted);overflow:hidden;text-decoration:none}
.prog u s{display:block;height:100%;background:var(--info);border-radius:99px}

l?", "disclaimer": "This guide explains how to use PropertyPro. It is not legal advice. Statutes change, and how any requirement applies depends on your association’s governing documents and circumstances. PropertyPro is not a law firm and does not provide legal advice or representation. Confirm your association’s obligations with its own attorney."}}, "notes": "Described from manager/documents/upload-document.mdx (updated 2026-10-03, featured). Real page parts that did not fit: the header row shows the category label in small caps plus up to three statute chips (this article has none); the article body is single-column up to 46rem with no table of contents, read time or updated date on the page itself (those chips appear only in the in-app help modal), so toc is empty. Condo/HOA-only blocks (the category list and the statute callout, which is a 'florida-statute' callout type) are hidden for apartment communities, which instead see a one-line list of apartment categories. The feedback card has Helpful / Not helpful buttons, the line 'Your feedback helps us improve help content for your community.', opens a comment box (placeholder 'Tell us what was missing or confusing.', button 'Send comment') after Not helpful, and confirms with 'Thanks — feedback saved.'. Below the feedback card are Previous/Next-in-topic cards ('Next in Documents →'). The disclaimer is injected on every article, with a longer wording naming the statutes when the article cites any."}, {"route": "/help/search", "group": "Help center", "navLabel": "Help search results", "template": "help", "icon": "search", "crumbs": ["Help for property managers", "Search"], "title": "4 results for “minutes”", "description": "Search results for guides and your community’s FAQs.", "help": {"view": "search", "query": "minutes", "shell": {"back": "Back to PropertyPro", "search": "Search help", "audience": ["Condominium", "Homeowners association", "Apartment community"], "audienceActive": 0}, "groups": [{"title": "Guid ibrary organized", "preview": "A quarterly routine for categories, duplicates, compliance links and retention."}]}], "footer": {"secondary": "Up next"}, "states": {"empty": {"title": "Help articles for your role haven't been written yet.", "text": "Contact support →"}, "error": {"title": "Couldn't load this article", "text": "We hit an error loading this help article. Please try again."}}}, "notes": "The help side panel is retired. This modal is the only in-app help surface, opened from the top bar and from each page header. Distinct from the help panel: it is the newer help surface, on when NEXT_PUBLIC_HELP_DOCS_MODAL_ENABLED is 'true' (the legacy panel then renders nothing). It opens from the top bar's help button, a labelled 'Help' ghost button in every page header, the '?' key, or a ?help=category/slug deep link. A centred dialog on desktop (40 to 56rem wide, resizable by dragging edges), a bottom sheet under 768px. Opened without a named article it lands straight on the page's FIRST contextual article (skeleton while loading) and shows the article itself, not the list: header row has a back arrow (once navigated), a category chip, a search toggle and an 'Open full help page' icon; body is the article; footer is 'N of M' with a 'Next: <title>' button while the page has more articles, else an 'Up next' card. The list shown here (Help for this page · N articles, 4 shown then 'Show N more', read checkmarks) is the fallback view, reached by Back or when the page has no first article. Search (2+ chars): skeleton rows, then an 'Articles' group ('No articles match “x”.' if none), a 'From your community's FAQ' group, and a Nothing-matches message 'Nothing matches “x” yet — try different words, or reach out.' with Contact support →. With no page articles it shows 'Featured for you'."}, {"route": "overlay: profile menu", "base": "/dashboard", "group": "Overlays", "navLabel": "Profile menu", "template": "overlay", "title": "Account menu", "overlay": {"type": "menu", "ancho ": "toggle-off"}]}, {"title": "Support access", "description": "Control whether PropertyPro support staff can access this community for troubleshooting.", "kind": "settings", "settings": [{"label": "Allow support access", "description": "Lets PropertyPro support staff open this community in read-only mode. All access is logged.", "control": "toggle-off"}]}], "notes": "Real page is one long scroll with an in-page section menu (Personal and Community groups). Residents see only Personal (plus Text alerts when texting is enabled). Owners also get a notice-consent card, and some plans add a snowbird digest card; Tenant access is hidden for apartments. Sub-pages (roles, export, transparency) are not linked from here in the real page.", "icon": "settings"}, {"route": "/settings/account", "group": "Settings", "navLabel": "Account details", "template": "settings", "crumbs": ["Settings", "Account details"], "title": "Account Settings", "description": "Your name, phone number and password.", "settingsNav": ["Account", "Payments", "Billing", "Roles & access", "Data export", "Transparency"], "settingsNavActive": "Account", "sections": [{"title": "Profile", "kind": "form", "form": [{"label": "Full name", "type": "text", "value": "Ana Ruiz"}, {"label": "Email", "type": "text", "value": "ana.ruiz@sunsetcondos.org", "hint": "Your sign-in address."}, {"label": "Phone", "type": "text", "value": "(305) 555-0142"}], "footer": {"left": "", "right": "Save profile"}}, {"title": "Password", "kind": "form", "form": [{"label": "Current password", "type": "text", "value": ""}, {"label": "New password", "type": "text", "value": "", "hint": "At least 8 characters with mixed case, a number and a symbol."}, {"label": "Confirm new password", "type": "text", "value": ""}], "footer": {"left": "", "right": "Change password"}}, {"title": "Danger zone", "kind": "settings", "settings": [{"label": "Delete account", "description": "Request deletion of your account. You must type DELETE to confirm.", "cont ccount and choose how processing fees are handled.", "settingsNav": ["Account", "Payments", "Billing", "Roles & access", "Data export", "Transparency"], "settingsNavActive": "Payments", "sections": [{"title": "Stripe account", "kind": "settings", "settings": [{"label": "Connect bank account", "description": "Set up Stripe to collect assessment payments from unit owners. You'll be redirected to Stripe to complete verification.", "control": "button:Connect with Stripe"}]}, {"title": "Payment fee policy", "description": "How online payment processing fees are handled for this community.", "kind": "settings", "settings": [{"label": "Association absorbs fees", "description": "No fee is shown to owners. Net collection is reduced by about 3% for card payments and 0.8% for ACH.", "control": "value:On"}]}, {"title": "Florida trust fund compliance", "kind": "text", "text": "Per section 718.111(14), each association's funds must be segregated. Your Stripe account is unique to this association; funds are never commingled with other communities or with PropertyPro."}], "notes": "Once connected, the Stripe section shows Onboarding, Charges and Payouts as Active or Pending, and Resume Setup if unfinished.", "icon": "settings"}, {"route": "/settings/payments/connected", "group": "Settings", "navLabel": "Stripe connected", "icon": "wallet", "template": "focus", "crumbs": ["Settings", "Payments", "Stripe connected"], "title": "Stripe Connected!", "description": "Stripe sends managers here after hosted onboarding. The page checks the account, then returns to payment settings.", "sections": [{"kind": "outcome", "outcome": {"tone": "ok", "title": "Stripe Connected!", "text": "Your account has been linked. Redirecting to payment settings.", "action": "Back to payment settings"}}], "notes": "Arriving here proves nothing, so the page first shows a spinner (Checking your Stripe account) and then one of: success (shown), Stripe is reviewing your account (details submitted, payments turn on after verification), Stripe setup isn't finished (account saved; choose Resume Setup on the payments page), or Connection Failed with a Go back button (missing community or a server error). All but the failure redirect to /settings/payments after 2 seconds. The Back button is a stand-in for that automatic redirect."}, {"route": "/settings/roles", "group": "Settings", "navLabel": "Roles & access", "template": "settings", "crumbs": ["Settings", "Roles & access"], "title": "Roles & Access", "description": "Promote or remove property managers, set board designations, and transfer the root manager role.", "settingsNav": ["Account", "Payments", "Billing", "Roles & access", "Data export", "Transparency"], "settingsNavActive": "Roles & access", "sections": [{"groupTitle": "Managers", "title": "Root manager", "kind": "settings", "settings": [{"label": "Ana Ruiz (you)", "description": "Controls role assignment, billing, community deletion and root transfer.", "control": "button:Transfer root role"}]}, {"title": "Property managers", "kind": "table", "columns": ["Name", "Email", "Action"], "data": [["Luis Ferreira", "luis@sunsetcondos.org", "Remove"], ["Dana Whitaker", "dana@sunsetcondos.org", "Remove"]]}, {"title": "Members", "kind": "table", "columns": ["Name", "Unit", "Action"], "data": [["Maria Delgado", "204", "Promote to property manager"], ["James Whitfield", "311", "Promote to property manager"], ["Priya Nair", "507", "Promote to property manager"]]}, {"groupTitle": "Board", "title": "Board", "description": "Board eligibility is governed by your bylaws and Florida statute; PropertyPro records the designation you set and does not determine eligibility.", "kind": "table", "columns": ["Name", "Unit", "Designation", "Action"], "data": [["Tom Okafor", "612", {"badge": "President", "tone": "info"}, "Change"], ["Maria Delgado", "204", {"badge": "Member", "tone": "neutral"}, "Change"], ["Priya Nair", "507", "None", "Set designation"]]}], "notes": "Root manager only; everyone else is sent to the dashboard. Mostly tables with row actions rather than toggle settings, so it sits at the edge of the settings shape.", "icon": "settings"}, {"route": "/settings/transparency", "group": "Settings", "navLabel": "Transparency", "template": "settings", "crumbs": ["Settings", "Transparency"], "title": "Transparency Settings", "description": "Control whether your public transparency page is visible.", "settingsNav": ["Account", "Payments", "Billing", "Roles & access", "Data export", "Transparency"], "settingsNavActive": "Transparency", "actions": [{"label": "Save settings", "kind": "primary"}], "sections": [{"title": "Public transparency page", "kind": "settings", "settings": [{"label": "Preview", "description": "Preview what your transparency page will look like.", "control": "link"}, {"label": "Enable public transparency page", "description": "When on, the page is available at sunset-condos.getpropertypro.com/transparency.", "control": "toggle-on"}, {"label": "Scope acknowledgment", "description": "I understand that this page displays factual data tracked within PropertyPro. It does not constitute legal certification, and tracked items are publicly visible.", "control": "toggle-on"}, {"label": "Page status", "description": "Whether the page is publicly visible right now.", "control": "value:Page is live"}]}], "notes": "Only for community types with a transparency page (condos and HOAs); others get a not-found page. The acknowledgment must be ticked before the page is first enabled. The exact public URL is built from the community subdomain and is a plausible example here.", "icon": "settings"}, {"route": "/auth/login", "group": "Sign in and sign up", "navLabel": "Sign in", "icon": "key-round", "shell": "auth", "template": "outside", "title": "Sign in to Sunset Condos", "description": "Use your email and password to access your community portal.", "actions": [], "sections": [], "auth": {"brand": "PropertyPro Florida", "form": [{"label": "Email", "type": "text", "value": "ana.ruiz@sunsetcondos.org"}, {"label": "Password", "type": "text", "value": "••••••••••"}], "primary": "Sign In", "secondary": ["Forgot password?", "New to PropertyPro? Create your account"], "aside": ["Your association's records, meetings and notices — in one place.", "Statutory documents posted on time", "Meeting notices that track the 14-day and 48-hour windows", "One portal for owners, tenants and the board", "Built for Florida §718 & §720 associations"], "legal": "", "states": {"error": "We couldn't reach the sign-in service. Please try again.", "success": "Your password has been updated. Sign in with your new password to continue."}}, "notes": "Split layout: photo panel with brand (hidden below 900px) on the left, form on the right. Eyebrow above the title reads 'Welcome back'. On a community host the heading is 'Sign in to <community>' and the community logo shows above it; on the main host it is 'Sign in to PropertyPro'. The success banner shows only when ?reset=success. Button reads 'Signing in...' while busy, then a full-screen loader 'Opening Sunset Condos' / 'Getting everything ready for you' (or 'Opening your portal'). A wrong password shows Supabase's safe message in an alert; only the unreachable wording is fixed in code. There is no passkey button on this page."}, {"route": "/signup", "group": "Sign in and sign up", "navLabel": "Create your account", "icon": "sparkles", "shell": "auth", "template": "outside", "title": "Florida requires your association's website. Let's build yours together.", "description": "Start with your email. You'll choose a plan only after you've seen exactly what your community needs.", "actions": [], "sections": [], "auth": {"brand": "PropertyPro Florida", "form": [{"label": "Email", "type": "text", "value": "dana.reyes@sunsetcondos.org"}], "primary": "Continue with email", "secondary": ["Already have an account? Sign in"], "steps": ["Email", "Check your email", "Community", "Place", "You", "Requirements", "Trial"], "stepActive": 0, "aside": ["A live card of the community being set up (name, type, address, size, web address, plan)", "Built for Florida §718 & §720 associations"], "legal": "We'll email you a secure sign-in link — no password to create.", "states": {"error": "Enter a valid email address, like name@example.com.", "success": "We sent a sign-in link to d***@sunsetcondos.org. Open it on this device and you'll land right back here."}}, "notes": "Eyebrow above the title: '30 days free'. The flow is email-first, no password. Step 2 'Check your email': title 'Check your email', button 'Resend link' (counts 'Resend in 0:59' for 60s), links 'Wrong email? Go back' and the hint 'Don't see it? Check your spam or promotions folder.' A link banner can show above step 1: 'That sign-in link has expired or was already used. Enter your email and we will send a new one.' or 'This link was requested on a different device or browser. Open it there, or enter your email to get a new link on this one.' A signed-in visitor skips steps 1-2 and sees 'Signed in as <email> / Use a different email'. ?type=pm redirects to /contact?from=pm-signup. Question steps show a progress bar and a footer 'Progress saves automatically' with Back and Continue. STEP 3 'type': title 'What's your community called?', lede 'Use the name owners know. The legal name can come later.', field 'Community name' (e.g., Sunset Condominium Association), radio cards 'Type of community': Condominium (Florida condominium association compliance workflows.), HOA (Florida HOA transparency and owner communication workflows.), Apartment (Operational tools for rentals and lease-driven communities.); errors 'Enter your community name.' / 'Choose the type of community.'; button 'Continue'. STEP 4 'place': title 'Where is <name>, and how big is it?', lede is a statute line (condos 25+ units under §718.111(12)(g); HOAs 100+ parcels under §720.303(4); apartments 'not covered by §718 or §720'); fields 'Street address' (autocomplete, with a manual-entry option that adds City, ZIP code (33131), County (Miami-Dade), shown 'Filled in from the address'), and a unit count stepper (Fewer / More, placeholder 184; label is Units or Parcels); an info card 'Website required' ('With 147 units, §718.111(12)(g) applies. We will track all N posting categories for you.') or 'Website optional at N units'; a warning if the address already has an association ('request access by searching for the association's name'); Florida-only ZIP error 'Enter a Florida ZIP code. PropertyPro Florida serves Florida associations only.'; button 'Continue'. STEP 5 'you': title 'Last step: who's setting this up?', lede 'Your name goes on the account, and the web address is where owners find your portal.', fields 'Your name' (Dana Reyes) and 'Web address' (slug input + fixed suffix of the portal host, with live availability text and a 'Use <suggestion>' button when taken; hint 'Owners will find your portal here, so choose carefully. It can't be changed after signup.'); button 'See what Florida requires'. STEP 6 'reveal': eyebrow 'Your requirements', title 'Here's what Florida requires of <name>' (apartments: 'Here's what your portal sets up for <name>'), lede 'We mapped N document categories from §718. Your dashboard tracks every one and tells you what to post next.'; grouped list (Governing documents, Financial records, ...) of statutory items each with a 'Needed' badge; apartments instead get six tool cards (Lease tracking, Package logging, Visitor passes, Maintenance requests, Announcements, Online payments). Footer note 'Nothing is due today — this is your starting point.', button 'Start 30-day free trial'. STEP 7 'trial': eyebrow 'Free for 30 days', title 'Start your free trial', lede 'Choose a plan. You won't be charged until <date>, and you can cancel anytime before then.'; plan cards (name, '$199 /month after trial' style price, one-line description; Professional carries a Pro badge; prices 199 / 349 for condo-HOA plans, 499 for apartments' Operations Plus); 'Due today $0.00' and 'Starting <date> $349.00/month'; Stripe Embedded Checkout mounts inline with 'Processed securely by Stripe. PropertyPro never sees your full card number.'; terms line 'By starting your trial, you agree to the Terms of Service and Privacy Policy.'; 'Cancel anytime before <date>.'; Back link. Errors there: 'Your sign-in expired. Your answers are saved on this device — sign in again to finish.', 'Payment system is temporarily unavailable. Please try again shortly.'. After checkout the visitor lands on /signup/checkout/return."}, {"route": "/auth/forgot-password", "group": "Sign in and sign up", "navLabel": "Forgot password", "icon": "key-round", "shell": "auth", "template": "outside", "title": "Reset your Sunset Condos password", "description": "Enter your email and we'll send you a link to reset your password.", "actions": [], "sections": [], "auth": {"brand": "Sunset Condos", "form": [{"label": "Email address", "type": "text", "value": "maria.delgado@example.com"}], "primary": "Send reset link", "secondary": ["Remember your password? Log in"], "legal": "", "states": {"error": "An unexpected error occurred. Please try again.", "success": "Check your email. (The sentence under it is the server's message, shown as returned.)"}}, "notes": "Centred single card on the page background, community logo above the title when on a community host. Heading is 'Reset your password' on the main host. Button reads 'Sending...' while busy. A rate-limited request shows the server's message as the error. After success the form is replaced by the heading 'Check your email', the server message, and a 'Back to login' link. Email format errors come from a schema (default 'Invalid email')."}, {"route": "/auth/reset-password", "group": "Sign in and sign up", "navLabel": "Reset password", "icon": "key-round", "shell": "auth", "template": "outside", "title": "Set new password", "description": "Enter your new password below.", "actions": [], "sections": [], "auth": {"brand": "Sunset Condos", "form": [{"label": "New password", "type": "text", "value": "••••••••••••"}, {"label": "Confirm new password", "type": "text", "value": "••••••••••••"}], "primary": "Set new password", "secondary": [], "legal": "", "states": {"error": "Passwords do not match", "success": "Redirects to /auth/login?reset=success, which shows: Your password has been updated. Sign in with your new password to continue."}}, "notes": "While the recovery link is being exchanged the form is three skeleton bars (up to 15 s). If it fails the card becomes 'Invalid or expired link' / 'This password reset link has expired or is invalid. Please request a new one.' with links 'Try again', 'Enter token manually', 'Request new reset link'. The manual screen is 'Enter your reset token' ('Paste the token from your reset email below. It looks like a long string of characters at the end of the link after token_hash=.'), a monospace field 'Reset token' (Paste your token here), buttons 'Verify token' and 'Back', error 'That token is invalid or has expired. Please request a new reset link.'. Submit button reads 'Updating...' while busy. Password-policy messages come from the shared policy (8 to 72 characters)."}, {"route": "/auth/verify-email", "group": "Sign in and sign up", "navLabel": "Verify your email", "icon": "check-check", "shell": "auth", "template": "outside", "title": "Verify your email", "description": "Your session is active, but your email address is not verified yet. Please check your inbox for a confirmation link, then refresh this page.", "actions": [], "sections": [], "auth": {"brand": "PropertyPro", "form": [], "primary": "I have verified my email", "secondary": ["Back to login"], "legal": "", "states": {}}, "notes": "A plain card with a heading, one paragraph and two buttons: the filled 'I have verified my email' goes to the returnTo address (default dashboard), the outline 'Back to login' goes to /auth/login. No form, no resend <script>
const PAGES=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SV=(d)=>`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={danger:SV('<path d="M8 2.2 14.3 13H1.7L8 2.2Z"/><path d="M8 6.5v3M8 11.3v.1"/>'),warn:SV('<circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.6M8 10.9v.1"/>'),info:SV('<circle cx="8" cy="8" r="6"/><path d="M8 7.4v3.6M8 5v.1"/>'),ok:SV('<circle cx="8" cy="8" r="6"/><path d="m5.4 8.2 1.8 1.8 3.4-3.8"/>'),neutral:SV('<circle cx="8" cy="8" r="6"/><path d="M5.5 8h5"/>')};
const R=d=>`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const RING={
  neutral:R('<circle cx="8" cy="8" r="6.2" stroke-dasharray="2.2 2.6"/>'),
  info:R('<circle cx="8" cy="8" r="6.2"/><path d="M8 3.6a4.4 4.4 0 0 1 0 8.8Z" fill="currentColor" stroke="none"/>'),
  warn:R('<circle cx="8" cy="8" r="6.2"/><path d="M8 4.6v4.1"/><circle cx="8" cy="11.1" r=".5" fill="currentColor"/>'),
  danger:R('<circle cx="8" cy="8" r="6.9" fill="currentColor" stroke="none"/><path d="M8 4.5v4.2" stroke="var(--card)"/><circle cx="8" cy="11.2" r=".7" fill="var(--card)" stroke="none"/>'),
  ok:R('<circle cx="8" cy="8" r="6.9" fill="currentColor" stroke="none"/><path d="m5.2 8.2 1.9 1.9 3.7-4" stroke="var(--card)"/>')};
let LOOK='sg';
const glyph=t=>(LOOK==='sg'?RING:IC)[tone(t)];
function dueChip(days,label){
  const lv=days<0?'critical':days<=7?'urgent':days<=30?'aware':'calm',n={calm:1,aware:2,urgent:3,critical:4}[lv];
  const txt=days<0?`${-days}d overdue`:days===0?'due today':`${days}d left`;
  return `<span class="due ${lv}"><span class="pips" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</span><b>${txt}</b>${label?`<span>${esc(label)}</span>`:''}</span>`}
function prog(a,b,word){const p=Math.max(0,Math.min(100,a/b*100));return `<span class="prog${a>=b?' full':''}"><u><s style="width:${p}%"></s></u><span class="num">${a} of ${b}${word?' '+esc(word):''}</span></span>`}
const rich=s=>esc(s).replace(/(§\s?\d+\.\d+(?:\(\d+\))?(?:\([a-z]\))?|HB \d+)/g,'<span class="stat">$1</span>');
const CHV=SV('<path d="m6 3.5 4.5 4.5L6 12.5"/>');
const tone=t=>IC[t]?t:'neutral';
const badge=b=>{const l=String(b.badge??b.label??''),m=/^(.*?)\s*(?:in|within) (\d+) days?$/i.exec(l);if(m)return dueChip(+m[2],m[1]);return `<span class="badge t-${tone(b.tone)}">${glyph(b.tone)}${esc(l)}</span>`};
const cell=c=>{if(c&&typeof c==='object')return 'due' in c?dueChip(c.due,c.label):badge(c);const m=/^(\d+) of (\d+)(?: (\w+))?$/.exec(String(c));if(m&&+m[2]>0&&+m[2]<1000)return prog(+m[1],+m[2],m[3]);return rich(c)};
const go=t=>`<a class="go" href="#"><span>${esc(t)}</span>${CHV}</a>`;
const kv=l=>`<div class="kv"><span>${esc(l[0])}</span><span class="num">${esc(l[1])}</span></div>`;
const TAG={outside:'O',help:'H',overlay:'V',list:'L',detail:'D',form:'F',settings:'S',exempt:'X',redirect:'R',canvas:'C',focus:'O',direction:'★'};
const NAME={outside:'Outside the app',help:'Help center',overlay:'Overlay',list:'List',detail:'Detail',form:'Form',settings:'Settings',exempt:'Bespoke',redirect:'Redirect',canvas:'Canvas',focus:'Focus',direction:'Reference'};

const ALIAS={home:'house','bar-chart':'chart-column'};
const lic=(n,cls)=>n?`<i data-lucide="${esc(ALIAS[n]||n)}" class="lic ${cls||''}"></i>`:'';
function statsOf(a){return `<div class="stats">${a.map(x=>`<div class="kpi"><span class="l">${esc(x.label)}</span><span class="v${x.tone?' t-ink':''}">${x.tone?`<span style="color:var(--${tone(x.tone)==='neutral'?'text3':tone(x.tone)});display:inline-flex">${glyph(x.tone)}</span>`:''}${esc(x.value)}</span>${x.of?`<div class="bar6"><span style="width:${Math.min(100,x.of[0]/x.of[1]*100).toFixed(1)}%"></span></div>`:''}${x.due!=null?dueChip(x.due,x.sub):x.sub?`<span class="s">${rich(x.sub)}</span>`:''}</div>`).join('')}</div>`}
function chartOf(c){const d=c.series||[],W=520,H=150,pad=18,mx=Math.max(...d.map(x=>x.value),1),n=d.length;

   +NAV.map(([g,items])=>(g?`<h6>${g}</h6>`:'')+items.map(it=>link(it[0],it[1],it[2],it[4],it[2]===act)).join('')).join('')
   +`<span class="sp"></span>`+link('Help','life-buoy','/help/contact',0,inHelp)+link('Settings','settings','/settings',0,inSet);

function direction(){return `<div class="dd">
 <div><h3>A calm record book where time is always visible</h3><p class="lede">This is the design direction for every signed-in page. It is mostly quiet: sand, ink and hairlines. Four things are allowed to stand out, and each has a rule for where it may appear. A page that follows the six rules below will look like it belongs.</p></div>
 <div><h4>Six rules</h4><div class="g3">
  <div><b>1. Time is the product</b><p>If a record has a deadline, show the time-left chip. Never a bare date.</p></div>
  <div><b>2. Quiet until it matters</b><p>Coral means one thing: the action to take. Other colour is for status and time only.</p></div>
  <div><b>3. One page, one shape</b><p>Header, main column, context. Every page picks a template. There are no exceptions.</p></div>
  <div><b>4. Say something true first</b><p>Every page opens with a figure or fact that is useful before the first record exists.</p></div>
  <div><b>5. Fewer boxes</b><p>Type and hairlines carry the hierarchy. Never a card inside a card.</p></div>
  <div><b>6. Icons name, glyphs tell</b><p>An icon says what kind of thing this is. A glyph says what state it is in. Never the other way round.</p></div>
 </div></div>
 <div><h4>The four signatures</h4>
  <div style="display:flex;flex-direction:column;gap:10px">
   <div class="spec"><span class="dsp">Violations</span><span class="dsp num">142</span><span class="about" style="max-width:38ch">Display face (Fraunces). Page titles, headline figures and first-run or outcome headlines only.</span></div>
   <div class="spec">${dueChip(44,'Dec 31')}${dueChip(12,'Dec 3')}${dueChip(4,'Nov 25')}${dueChip(-3,'Nov 18')}<span class="about" style="max-width:38ch">Time-left chip. Calm, aware, urgent, overdue. The pips and the words carry the level, not colour alone.</span></div>
   <div class="spec">${['neutral','info','warn','danger','ok'].map((t,i)=>`<span style="display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--text2)"><span style="color:var(--${t==='neutral'?'text3':t});display:inline-flex;width:18px;height:18px">${RING[t]}</span>${['Not started','In progress','Needs attention','Overdue','Done'][i]}</span>`).join('')}</div>
   <div class="spec"><span style="display:inline-flex;gap:14px;color:var(--text3)">${lic('file-text')}${lic('calendar')}${lic('wrench')}</span><span class="ptile" style="display:grid;background:var(--text);border-color:var(--text);color:var(--card);width:32px;height:32px;border-radius:8px;place-items:center">${lic('package')}</span><span class="about" style="max-width:46ch">Place mark. Icons are bare and monochrome. One solid ink tile marks where you are: the selected item in the navigation, repeated beside the page title.</span></div>
  </div></div>
 <div><h4>Icon rules</h4><ol>
  <li><b>One library, one wrapper.</b> Lucide, imported only through a local Icon component, so weight and size cannot be set by hand.</li>
  <li><b>One weight, three sizes.</b> 1.6 stroke to sit with the text. 16 in rows and tables, 20 in controls and navigation, 24 in tiles and empty states.</li>
  <li><b>Monochrome.</b> Icons take the text colour. Colour appears only on a status glyph, and always with a word.</li>
  <li><b>The tile means one thing.</b> A solid ink tile marks the current place, in the navigation and beside the page title. Every other icon is bare.</li>
  <li><b>Labels by default.</b> Icon-only buttons are limited to close, search, more, back and expand.</li>
  <li><b>One concept, one icon.</b> The registry below is the only source. A new concept adds a line to it.</li></ol></div>
 <div><h4>Icon registry</h4><div class="icons">${REG.map(([n,l])=>`<div><span class="kico" style="color:var(--text)">${lic(n)}</span>${l}</div>`).join('')}</div></div>
 <div><h4>What keeps it from dating</h4><div class="g3">
  <div><b>Structure, not effects</b><p>Hierarchy comes from position, size and weight. No gradients, glass, glow or long shadows.</p></div>
  <div><b>Three weights of rule</b><p>A hairline between rows, a firmer rule under headers, a double rule under the summary figures. Nothing else divides the page.</p></div>
  <div><b>Numbers set properly</b><p>Tabular figures, amounts right-aligned, one date format, mono for citations and stamps.</p></div>
  <div><b>Furniture that is information</b><p>The running head says where you are and as of when. Statute numbers are real citations. Nothing is there for looks.</p></div>
  <div><b>A registrar's voice</b><p>Plain and exact: "Posted Nov 18. Due in 9 days." No exclamation marks, no cleverness.</p></div>
  <div><b>The serif, de-quirked</b><p>Fraunces with its soft and wonky settings off, at moderate weight, on titles and figures only.</p></div>
 </div></div>
 <div><h4>Before a page ships</h4><ol>
  <li>Does it use a template (list, detail, form, settings, canvas or focus)?</li>
  <li>Does the header say what the page is for in one sentence, with one main action?</li>
  <li>Does it open with something true, even when empty?</li>
  <li>Does every deadline use the time-left chip, and every status a glyph with a word?</li>
  <li>Is the display face used only for the title and headline figures?</li>
  <li>Is coral used only on the main action and links?</li>
  <li>Is there any box inside a box? Remove it.</li></ol></div>
</div>`}
