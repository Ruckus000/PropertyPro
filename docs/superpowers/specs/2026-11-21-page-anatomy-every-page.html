<title>Every Page, Revised B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a page index on the left, one app-frame mockup on the right. Single light theme on purpose:
   the app being mocked is light-only (sand surfaces, coral action colour). */
:root{
  color-scheme:light;
  --page:#FBF7F1; --card:#FFFEFC; --subtle:#FDFBF8; --muted:#F6EFE6;
  --edge:#EFE7DC; --edge-strong:#E3D8C9;
  --text:#1B1A18; --text2:#57534E; --text3:#78716C;
  --coral:#C2533A; --coral-hover:#A8412C;
  --danger:#B42318; --danger-bg:#FEF3F2; --danger-edge:#FECDCA;
  --warn:#B45309; --warn-bg:#FFFAEB; --warn-edge:#FDE7B0;
  --info:#1C5A52; --info-bg:#EFF8F6; --info-edge:#C5E4DE;
  --ok:#157F3C; --ok-bg:#EFFAF2; --ok-edge:#BFE6CB;
  --neutral:#57534E; --neutral-bg:#F4F1EC; --neutral-edge:#E3D8C9;
  --bench:#EEE7DC;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --e1:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bench);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3,h4,h5,p{margin:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.app{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.top p{color:var(--text2);font-size:14px;margin-top:4px}
.tally{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tally span{font-size:12px;border:1px solid var(--edge-strong);border-radius:999px;padding:2px 8px;background:var(--card);color:var(--text2)}
.index{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
@media(max-width:900px){.index{position:static;max-height:none}.index nav{display:none}}
.index input,.index select{font:inherit;font-size:14px;height:36px;border:1px solid var(--edge-strong);border-radius:6px;padding:0 10px;background:var(--card);color:var(--text);width:100%}
.index select{display:none}@media(max-width:900px){.index select{display:block}.index input{display:none}}
.index h2{font-size:12px;font-weight:500;color:var(--text3);margin:10px 0 4px}
.index a{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;color:var(--text);text-decoration:none;padding:5px 8px;border-radius:6px}
.index a:hover{background:var(--muted)}
.index a[aria-current="true"]{background:var(--card);box-shadow:var(--e1);font-weight:500}
.index a i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--text3)}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.route{font-family:var(--mono);font-size:13px;color:var(--text2);overflow-wrap:anywhere}
.seg{display:inline-flex;background:var(--muted);border:1px solid var(--edge-strong);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:14px;font-weight:500;color:var(--text2);background:transparent;border:0;border-radius:7px;padding:6px 12px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--e1)}
.seg button:disabled{opacity:.45;cursor:default}
.note{font-size:14px;color:var(--text2);border-left:2px solid var(--text);padding-left:10px;max-width:90ch}
.note b{color:var(--text);font-weight:600}

.frame{background:var(--page);border:1px solid var(--edge-strong);border-radius:12px;overflow:hidden;box-shadow:0 12px 32px rgba(60,40,20,.10)}
.crumbs{font-size:13px;color:var(--text3);padding:12px 24px;border-bottom:1px solid var(--edge)}
.crumbs b{color:var(--text);font-weight:500}
.body{padding:20px 24px 32px;display:flex;flex-direction:column;gap:20px;min-width:0;min-height:480px}
@media(max-width:640px){.body{padding:16px}.crumbs{padding:10px 16px}}

.btn{font:inherit;font-size:14px;font-weight:500;border-radius:8px;height:32px;padding:0 12px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--coral);color:#fff}
.btn.outline{background:var(--card);border-color:var(--edge-strong);color:var(--text)}
.btn.danger{background:var(--card);border-color:var(--danger-edge);color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 8px 2px 6px;border:1px solid;white-space:nowrap}
.badge svg,.ico svg{flex:none}.badge svg{width:12px;height:12px}
.t-danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-edge)}
.t-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-edge)}
.t-info{color:var(--info);background:var(--info-bg);border-color:var(--info-edge)}
.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-edge)}
.t-neutral{color:var(--neutral);background:var(--neutral-bg);border-color:var(--neutral-edge)}
.num{font-variant-numeric:tabular-nums}
.link{color:var(--coral-hover);font-weight:500;text-decoration:none}

.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
.head h3{font-size:20px;font-weight:600;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.head p{color:var(--text2);font-size:14px;max-width:64ch;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-areas:"main top" "main rest";grid-template-rows:auto 1fr;column-gap:20px;align-items:start}
.grid.solo{grid-template-columns:minmax(0,1fr);grid-template-areas:"main"}
.grid.narrowmain .mainc{max-width:720px}
.mainc{grid-area:main;min-width:0;display:flex;flex-direction:column;gap:16px}
.ptop{grid-area:top;background:var(--card);border:1px solid var(--edge);border-radius:8px 8px 0 0}
.prest{grid-area:rest;background:var(--card);border:1px solid var(--edge);border-top:0;border-radius:0 0 8px 8px}
.ptop.only{border-radius:8px}
@media(max-width:1100px){.grid{grid-template-columns:1fr;grid-template-areas:"top" "main" "rest";row-gap:16px}.ptop,.prest{border-radius:8px;border-top:1px solid var(--edge)}}
.grp{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.grp+.grp{border-top:1px solid var(--edge)}
.grp h4{font-size:12px;font-weight:500;color:var(--text3)}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.big small{font-size:14px;font-weight:400;color:var(--text3);letter-spacing:0}
.kv{display:flex;justify-content:space-between;font-size:14px;gap:12px}.kv span:first-child{color:var(--text2)}.kv span:last-child{text-align:right}
.attn{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-edge);border-radius:6px;padding:10px;font-size:14px}
.attn svg{width:16px;height:16px;flex:none;color:var(--warn);margin-top:2px}
.attn b{font-weight:500;display:block}
.go{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--text);text-decoration:none;padding:3px 0}
.go svg{width:14px;height:14px;color:var(--text3);flex:none}
.about{font-size:13px;color:var(--text2)}
.pv{border:1px solid var(--edge);border-radius:6px;background:var(--subtle);padding:10px;font-size:13px;color:var(--text2)}
.pv b{display:block;color:var(--text);font-weight:500;font-size:14px}

.sec{background:var(--card);border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.sec-h{padding:12px 16px;border-bottom:1px solid var(--edge)}
.sec-h h4{font-size:15px;font-weight:600}.sec-h p{font-size:13px;color:var(--text2)}
.tools{display:flex;flex-wrap:nowrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--edge)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;min-width:0;flex:1 1 auto;scrollbar-width:none}.chip{white-space:nowrap;flex:none}
.chip{font-size:13px;border:1px solid var(--edge-strong);border-radius:999px;padding:3px 10px;color:var(--text2);background:var(--card)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip .num{opacity:.7;margin-left:4px}
.search{font:inherit;font-size:14px;height:32px;border:1px solid var(--edge-strong);border-radius:6px;padding:0 10px;background:var(--card);color:var(--text);width:220px;max-width:45%;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-f{align-items:center;padding:10px 16px;border-top:1px solid var(--edge);background:var(--subtle);font-size:13px;color:var(--text3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-top:1px solid var(--edge);align-items:center}
.item.first{border-top:0}
.ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;border:1px solid}.ico svg{width:16px;height:16px}
.item h5{font-size:15px;font-weight:600}
.item p{font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:13px;color:var(--text3);margin-top:2px}
.out{font-size:13px;color:var(--text2);text-align:right;max-width:260px}
.out.bad{color:var(--warn);font-weight:500}
@media(max-width:520px){.item{grid-template-columns:32px minmax(0,1fr)}.out{grid-column:2;text-align:left}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{text-align:left;font-weight:500;color:var(--text3);font-size:12px;padding:0 16px;height:32px;white-space:nowrap}
td{padding:0 16px;height:44px;border-top:1px solid var(--edge);white-space:nowrap;color:var(--text2)}
td:first-child{color:var(--text);font-weight:500;white-space:normal;min-width:168px}th,td{padding-left:12px;padding-right:12px}th:first-child,td:first-child{padding-left:16px}td.act{color:var(--coral-hover);font-weight:500}td.act .btn{height:28px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px;padding:16px}
.fields dt{font-size:12px;color:var(--text3)}.fields dd{margin:2px 0 0;font-size:14px}
.prose{padding:16px;font-size:14px;color:var(--text2);max-width:70ch}
.form{padding:16px;display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
.fld .hint{font-size:13px;color:var(--text3);margin-top:4px}
.inp{border:1px solid var(--edge-strong);border-radius:6px;background:var(--card);min-height:32px;padding:5px 10px;font-size:14px;color:var(--text2);max-width:520px}
.inp.area{min-height:84px}
.inp.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:280px}.inp.sel svg{width:14px;height:14px;flex:none;color:var(--text3);transform:rotate(90deg)}
.radio{display:flex;gap:8px;flex-wrap:wrap}.opt{display:inline-flex;align-items:center;gap:8px;font-size:14px;border:1px solid var(--edge-strong);border-radius:8px;padding:6px 12px 6px 10px;background:var(--card);color:var(--text2)}.opt i{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--edge-strong);flex:none}.opt.on{border-color:var(--text);color:var(--text);font-weight:500}.opt.on i{border:4px solid var(--text)}
.srow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--edge)}
.srow.first{border-top:0}
.srow b{display:block;font-size:15px;font-weight:500}.srow span.d{font-size:13px;color:var(--text2)}
.tog{width:36px;height:20px;border-radius:99px;background:var(--edge-strong);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:#fff}
.tog.on{background:var(--coral)}.tog.on::after{left:18px}
.val{font-size:14px;color:var(--text2);text-align:right}
.empty{padding:28px 24px 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty h5{font-size:17px;font-weight:600;letter-spacing:-.01em}
.empty p{color:var(--text2);font-size:14px;max-width:52ch}
.ghost{margin:0 16px 16px;border:1px dashed var(--edge-strong);border-radius:8px;background:var(--subtle)}
.ghost .tag{font-size:12px;color:var(--text3);padding:8px 16px 0;display:block}
.ghost td{border-top:0}.ghost table{min-width:440px}
.bespoke{border:1px dashed var(--edge-strong);border-radius:8px;padding:40px 24px;text-align:center;color:var(--text2);background:var(--subtle)}
.bespoke b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.setnav{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:start}
.setnav nav{display:flex;flex-direction:column;gap:2px;font-size:14px}
.setnav nav span{padding:6px 10px;border-radius:6px;color:var(--text2)}
.setnav nav span.on{background:var(--muted);color:var(--text);font-weight:500}
@media(max-width:760px){.setnav{grid-template-columns:1fr}.setnav nav{flex-direction:row;flex-wrap:wrap}}
.gt{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:4px}
.pager{display:flex;justify-content:space-between;gap:8px}

/* structure added after the fit test: page tabs, steps, card records */
.ptabs{display:flex;gap:20px;border-bottom:1px solid var(--edge-strong);overflow-x:auto;margin-top:-4px}
.ptabs span{font-size:14px;font-weight:500;color:var(--text2);padding:8px 0;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.ptabs span.on{color:var(--text);border-bottom-color:var(--coral)}
.ptabs em{font-style:normal;font-size:12px;color:var(--text3);background:var(--muted);border-radius:99px;padding:0 6px}
.steps{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center;font-size:14px;color:var(--text3)}
.steps span{display:inline-flex;align-items:center;gap:8px}
.steps b{width:22px;height:22px;border-radius:99px;border:1px solid var(--edge-strong);display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--card);color:var(--text2)}
.steps .done b{background:var(--ok-bg);border-color:var(--ok-edge);color:var(--ok)}
.steps .on{color:var(--text);font-weight:500}.steps .on b{background:var(--text);border-color:var(--text);color:#fff}
.steps i{width:28px;height:1px;background:var(--edge-strong);margin:0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:16px}
.rc{border:1px solid var(--edge);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card);min-width:0}
.rc h5{font-size:15px;font-weight:600}
.rc p{font-size:14px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .m{font-size:13px;color:var(--text3)}
.rc .f{margin-top:auto;padding-top:10px;border-top:1px solid var(--edge);display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2)}
.rc .f.bad{color:var(--warn);font-weight:500}
.who{display:inline-flex;align-items:center;gap:8px}
.av{display:none}
.meter{display:none}

/* REFINED LOOK: same structure, same colours, more craft. Scoped to .rf so the two can be compared. */
.rf .head{padding-bottom:16px;border-bottom:1px solid var(--edge)}
.rf .head:has(+ .ptabs){border-bottom:0;padding-bottom:0}
.rf .head h3{font-size:24px;letter-spacing:-.025em;line-height:1.2}
.rf .head p{font-size:15px;margin-top:4px}
.rf .btn{transition:background-color .12s,border-color .12s,transform .12s}
.rf .btn:active{transform:translateY(1px)}
.rf .btn.outline:hover{background:var(--muted)}
.rf .btn.primary:hover{background:var(--coral-hover)}
.rf .ptop,.rf .prest{background:transparent;border:0;border-left:1px solid var(--edge-strong);border-radius:0}
.rf .grp{padding:4px 0 16px 20px}.rf .grp+.grp{border-top:0;padding-top:12px}
.rf .prest .grp:first-child{padding-top:12px}
.rf .grp h4{letter-spacing:.01em}
.rf .big{font-size:32px;letter-spacing:-.03em}
.rf .big small{display:block;margin-top:2px}
.rf .meter{display:block;height:6px;border-radius:99px;background:var(--muted);overflow:hidden}
.rf .meter span{display:block;height:100%;background:var(--info);border-radius:99px}
.rf .kv{padding:4px 0;border-top:1px solid var(--edge)}.rf .kv span:last-child{color:var(--text);font-weight:500}
.rf .go{padding:5px 8px;margin:0 -8px;border-radius:6px;transition:background-color .12s}.rf .go:hover{background:var(--muted)}
@media(max-width:1100px){.rf .ptop,.rf .prest{border-left:0;border-top:1px solid var(--edge-strong)}.rf .grp{padding-left:0;padding-top:12px}}
.rf .tools{padding:0 16px;gap:0 12px;min-height:44px;align-items:center}.tools .chips:empty{display:none}.tools .chips:empty+.search{margin-left:auto}
.rf .chips{gap:18px}
.rf .chip{border:0;border-radius:0;background:transparent;padding:10px 0;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.rf .chip.on{background:transparent;color:var(--text);border-bottom-color:var(--text)}
.rf .chip .num{opacity:1;font-size:12px;color:var(--text3);background:var(--muted);border-radius:99px;padding:0 6px;margin-left:6px}
.rf .search{height:30px;background:var(--subtle)}
.rf .sec-h h4{font-size:14px}
.rf th{background:var(--subtle);border-bottom:1px solid var(--edge);height:34px;letter-spacing:.01em}
.rf td{height:42px}
.rf tbody tr{transition:background-color .12s}.rf tbody tr:hover{background:var(--subtle)}
.rf tbody tr:first-child td{border-top:0}
.rf td.n,.rf th.n{text-align:right;font-family:var(--mono);font-size:13px}
.rf th.n{font-family:var(--sans);font-size:12px}
.rf .av{display:grid;place-items:center;width:24px;height:24px;border-radius:99px;background:var(--muted);border:1px solid var(--edge-strong);font-size:10px;font-weight:600;color:var(--text2);flex:none;letter-spacing:.02em}
.rf .item{transition:background-color .12s;cursor:default}.rf .item:hover{background:var(--subtle)}
.rf .ico{width:28px;height:28px;border-radius:99px}.rf .ico svg{width:14px;height:14px}
.rf .item{grid-template-columns:28px minmax(0,1fr) auto}
.rf .item h5{font-weight:500}
.rf .out{font-size:13px}
.rf .rc{transition:border-color .12s}.rf .rc:hover{border-color:var(--edge-strong)}
.rf .rc h5{font-weight:500}
.rf .fields dd{font-weight:500}
.rf .inp{background:var(--subtle)}
.rf .srow b{font-size:14px}
.rf .gt{font-size:13px;font-weight:500;color:var(--text3);letter-spacing:.01em;margin-top:8px}
.rf .sec-f{background:transparent;font-size:12px}
@media(prefers-reduced-motion:reduce){.rf *{transition:none!important}}

/* always-on pieces added with the signature pass (they are structure, not styling) */
.due{display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;color:var(--text2)}
.due b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--text)}
.pips{display:inline-flex;gap:2px}.pips i{width:5px;height:12px;border-radius:2px;background:var(--edge-strong)}
.due.calm .pips i.f{background:var(--info)}.due.aware .pips i.f{background:#C98A1B}.due.urgent .pips i.f{background:var(--warn)}.due.critical .pips i.f{background:var(--danger)}
.due.critical b{color:var(--danger)}.due.urgent b{color:var(--warn)}
.prog{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.prog u{display:inline-block;width:56px;height:6px;border-radius:99px;background:var(--muted);overflow:hidden;text-decoration:none}
.prog u s{display:block;height:100%;background:var(--info);border-radius:99px}

<script>
const PAGES=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SV=(d)=>`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC={danger:SV('<path d="M8 2.2 14.3 13H1.7L8 2.2Z"/><path d="M8 6.5v3M8 11.3v.1"/>'),warn:SV('<circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.6M8 10.9v.1"/>'),info:SV('<circle cx="8" cy="8" r="6"/><path d="M8 7.4v3.6M8 5v.1"/>'),ok:SV('<circle cx="8" cy="8" r="6"/><path d="m5.4 8.2 1.8 1.8 3.4-3.8"/>'),neutral:SV('<circle cx="8" cy="8" r="6"/><path d="M5.5 8h5"/>')};
const R=d=>`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const RING={
  neutral:R('<circle cx="8" cy="8" r="6.2" stroke-dasharray="2.2 2.6"/>'),
  info:R('<circle cx="8" cy="8" r="6.2"/><path d="M8 3.6a4.4 4.4 0 0 1 0 8.8Z" fill="currentColor" stroke="none"/>'),
  warn:R('<circle cx="8" cy="8" r="6.2"/><path d="M8 4.6v4.1"/><circle cx="8" cy="11.1" r=".5" fill="currentColor"/>'),
  danger:R('<circle cx="8" cy="8" r="6.9" fill="currentColor" stroke="none"/><path d="M8 4.5v4.2" stroke="var(--card)"/><circle cx="8" cy="11.2" r=".7" fill="var(--card)" stroke="none"/>'),
  ok:R('<circle cx="8" cy="8" r="6.9" fill="currentColor" stroke="none"/><path d="m5.2 8.2 1.9 1.9 3.7-4" stroke="var(--card)"/>')};
let LOOK='sg';
const glyph=t=>(LOOK==='sg'?RING:IC)[tone(t)];
function dueChip(days,label){
  const lv=days<0?'critical':days<=7?'urgent':days<=30?'aware':'calm',n={calm:1,aware:2,urgent:3,critical:4}[lv];
  const txt=days<0?`${-days}d overdue`:days===0?'due today':`${days}d left`;
  return `<span class="due ${lv}"><span class="pips" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</span><b>${txt}</b>${label?`<span>${esc(label)}</span>`:''}</span>`}
function prog(a,b,word){const p=Math.max(0,Math.min(100,a/b*100));return `<span class="prog${a>=b?' full':''}"><u><s style="width:${p}%"></s></u><span class="num">${a} of ${b}${word?' '+esc(word):''}</span></span>`}
const rich=s=>esc(s).replace(/(§\s?\d+\.\d+(?:\(\d+\))?(?:\([a-z]\))?|HB \d+)/g,'<span class="stat">$1</span>');
const CHV=SV('<path d="m6 3.5 4.5 4.5L6 12.5"/>');
const tone=t=>IC[t]?t:'neutral';
const badge=b=>{const l=String(b.badge??b.label??''),m=/^(.*?)\s*(?:in|within) (\d+) days?$/i.exec(l);if(m)return dueChip(+m[2],m[1]);return `<span class="badge t-${tone(b.tone)}">${glyph(b.tone)}${esc(l)}</span>`};
const cell=c=>{if(c&&typeof c==='object')return 'due' in c?dueChip(c.due,c.label):badge(c);const m=/^(\d+) of (\d+)(?: (\w+))?$/.exec(String(c));if(m&&+m[2]>0&&+m[2]<1000)return prog(+m[1],+m[2],m[3]);return rich(c)};
const go=t=>`<a class="go" href="#"><span>${esc(t)}</span>${CHV}</a>`;
const kv=l=>`<div class="kv"><span>${esc(l[0])}</span><span class="num">${esc(l[1])}</span></div>`;
const TAG={list:'L',detail:'D',form:'F',settings:'S',exempt:'X',redirect:'R'};
const NAME={list:'List',detail:'Detail',form:'Form',settings:'Settings',exempt:'Bespoke',redirect:'Redirect'};

function itemRow(r,first){return `<div class="item${first?' first':''}"><div class="ico t-${tone(r.tone)}">${glyph(r.tone)}</div><div style="min-width:0"><h5>${esc(r.title)}</h5>${r.preview?`<p>${esc(r.preview)}</p>`:''}${r.meta?`<div class="m">${esc(r.meta)}</div>`:''}</div>${outcome(r)}</div>`}
function outcome(r){if(r.due)return `<div class="out">${dueChip(r.due.days,r.due.label)}</div>`;const o=r.outcome;if(!o)return '<div></div>';const m=/^(.*?)\s*(?:in|within) (\d+) days?$/i.exec(o);if(m)return `<div class="out">${dueChip(+m[2],m[1])}</div>`;return `<div class="out${r.outcomeBad?' bad':''}">${esc(o)}</div>`}
const PERSON=/^(resident|owner|name|member|tenant|visitor|guest|signer|recipient|requester|reported by|sent by|submitted by|assigned to|vendor|contact|user|actor|who|manager|author)s?$/i;
const NUMERIC=/^-?\$?[\d,]+(\.\d+)?%?$/;
const initials=n=>String(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function tableOf(cols,data){
  const person=cols.map(c=>PERSON.test(String(c).trim()));
  const numeric=cols.map((c,i)=>i>0&&data.length>0&&data.every(r=>typeof r[i]==='string'&&NUMERIC.test(r[i].trim())));
  const act=cols.map(c=>/^actions?$/i.test(String(c).trim()));
  const td=(c,i)=>act[i]?`<td class="act">${c&&typeof c==='object'?`<button class="btn outline">${esc(c.badge??c.label)}</button>`:esc(c)}</td>`:typeof c==='string'&&person[i]&&/^[A-Z][a-z'’-]+ [A-Z]/.test(c)?`<td><span class="who"><span class="av" aria-hidden="true">${esc(initials(c))}</span>${esc(c)}</span></td>`:`<td${numeric[i]?' class="n"':''}>${cell(c)}</td>`;
  return `<div class="scroll"><table><thead><tr>${cols.map((c,i)=>`<th${numeric[i]?' class="n"':''}>${esc(c)}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${r.map(td).join('')}</tr>`).join('')}</tbody></table></div>`}
function cardOf(r){return `<div class="rc"><div>${badge({label:(r.meta||'').split(' · ')[0]||'Open',tone:r.tone})}</div><h5>${esc(r.title)}</h5>${r.preview?`<p>${esc(r.preview)}</p>`:''}${r.meta?`<div class="m">${esc((r.meta||'').split(' · ').slice(1).join(' · '))}</div>`:''}<div class="f${r.outcomeBad?' bad':''}"><span>${esc(r.outcome||'')}</span><a class="link" href="#">View</a></div></div>`}
function formField(f){
  const lab=`<label>${esc(f.label)}</label>`,hint=f.hint?`<div class="hint">${esc(f.hint)}</div>`:'';
  if(f.type==='toggle')return `<div class="srow first" style="padding:0"><div><b>${esc(f.label)}</b>${f.hint?`<span class="d">${esc(f.hint)}</span>`:''}</div><div class="tog${f.value?' on':''}"></div></div>`;
  if(f.type==='radio')return `<div class="fld">${lab}<div class="radio">${(f.options||[]).map((o,i)=>`<span class="opt${(f.value?o===f.value:i===0)?' on':''}"><i></i>${esc(o)}</span>`).join('')}</div>${hint}</div>`;
  if(f.type==='select')return `<div class="fld">${lab}<div class="inp sel"><span>${esc(f.value||'Choose')}</span>${CHV}</div>${hint}</div>`;
  return `<div class="fld">${lab}<div class="inp${f.type==='textarea'?' area':''}">${esc(f.value||'')}</div>${hint}</div>`;
}
function setRow(r,first){
  const c=r.control||'';let ctl='';
  if(c==='toggle-on')ctl='<div class="tog on"></div>';else if(c==='toggle-off')ctl='<div class="tog"></div>';
  else if(c==='link')ctl=CHV.replace('<svg','<svg style="width:14px;height:14px;color:var(--text3)"');
  else if(c.startsWith('button:'))ctl=`<button class="btn outline">${esc(c.slice(7))}</button>`;
  else if(c.startsWith('value:'))ctl=`<span class="val">${esc(c.slice(6))}</span>`;
  return `<div class="srow${first?' first':''}"><div><b>${esc(r.label)}</b>${r.description?`<span class="d">${rich(r.description)}</span>`:''}</div>${ctl}</div>`;
}
function section(s,emptyCfg){
  let h='';
  if(s.groupTitle)h+=`</div><h4 class="gt">${esc(s.groupTitle)}</h4><div class="sec">`;
  if(s.title)h+=`<div class="sec-h"><h4>${esc(s.title)}</h4>${s.description?`<p>${esc(s.description)}</p>`:''}</div>`;
  if(emptyCfg){
    h+=`<div class="empty"><h5>${esc(emptyCfg.title)}</h5><p>${esc(emptyCfg.text)}</p>${emptyCfg.action?`<div class="acts" style="margin-top:10px"><button class="btn primary">${esc(emptyCfg.action)}</button></div>`:''}</div>`;
    const ex=s.kind==='rows'&&s.rows&&s.rows[0]?(s.layout==='cards'?`<div class="cards">${cardOf(s.rows[0])}</div>`:itemRow(s.rows[0],true)):s.kind==='table'&&s.data&&s.data[0]?tableOf(s.columns,[s.data[0]]):'';
    if(ex)h+=`<div class="ghost"><span class="tag">Example of ${esc(emptyCfg.exampleOf||'a record')}</span>${ex}</div>`;
    return `<div class="sec">${h}</div>`.replace('<div class="sec"></div>','');
  }
  if(s.toolbar)h+=`<div class="tools"><div class="chips">${(s.toolbar.filters||[]).map((f,i)=>`<span class="chip${i===0?' on':''}">${esc(f.label)}${f.count!=null?`<span class="num">${esc(f.count)}</span>`:''}</span>`).join('')}</div>${s.toolbar.search?`<div class="search" style="line-height:30px;color:var(--text3)"><span style="overflow:hidden;text-overflow:ellipsis">${esc(s.toolbar.search)}</span><kbd>/</kbd></div>`:''}</div>`;
  if(s.kind==='rows'&&s.layout==='cards')h+=`<div class="cards">${(s.rows||[]).map(cardOf).join('')}</div>`;
  else if(s.kind==='rows')h+=`<div class="${/timeline|activity|history|replies/i.test(s.title||'')?'tl':''}">${(s.rows||[]).map((r,i)=>itemRow(r,i===0)).join('')}</div>`;
  else if(s.kind==='table')h+=tableOf(s.columns||[],s.data||[]);
  else if(s.kind==='fields')h+=`<dl class="fields">${(s.fields||[]).map(f=>`<div><dt>${esc(f.label)}</dt><dd>${cell(f.value)}</dd></div>`).join('')}</dl>`;
  else if(s.kind==='form')h+=`<div class="form">${(s.form||[]).map(formField).join('')}</div>`;
  else if(s.kind==='settings')h+=(s.settings||[]).map((r,i)=>setRow(r,i===0)).join('');
  else if(s.kind==='text')h+=`<div class="prose">${rich(s.text)}</div>`;
  if(s.footer)h+=`<div class="sec-f"><span>${esc(s.footer.left||'')}</span>${/^(Save|Export|Add|Send|Download|Update|Request|Apply|Connect|Create|Change|Delete|Load|Prepare|View)\b/.test(s.footer.right||'')?`<button class="btn outline">${esc(s.footer.right)}</button>`:`<span>${esc(s.footer.right||'')}</span>`}</div>`;
  return `<div class="sec">${h}</div>`.replace('<div class="sec"></div>','');
}
function meter(fig,unit){const a=parseFloat(String(fig).replace(/[^0-9.]/g,'')),m=/^of \$?([\d,.]+)/.exec(String(unit||''));if(!m||isNaN(a))return '';const b=parseFloat(m[1].replace(/,/g,''));if(!b)return '';return `<div class="meter"><span style="width:${Math.max(0,Math.min(100,a/b*100)).toFixed(1)}%"></span></div>`}
function panel(p,isEmpty){
  const x=p.panel;if(!x)return '';
  const g=[];
  if(x.glance)g.push(`<div class="grp"><h4>At a glance</h4><div class="big num">${esc(isEmpty&&x.glance.emptyFigure!=null?x.glance.emptyFigure:x.glance.figure)} <small>${esc(x.glance.unit||'')}</small></div>${meter(isEmpty&&x.glance.emptyFigure!=null?x.glance.emptyFigure:x.glance.figure,x.glance.unit)}${isEmpty?'':(x.glance.lines||[]).map(kv).join('')}</div>`);
  if(x.details)g.push(`<div class="grp"><h4>Details</h4>${x.details.map(kv).join('')}</div>`);
  if(x.preview)g.push(`<div class="grp"><h4>${esc(x.preview.heading||'Preview')}</h4><div class="pv"><b>${esc(x.preview.title)}</b>${esc(x.preview.body)}</div></div>`);
  if(x.attention){const a=x.attention;g.push(`<div class="grp"><h4>Needs attention</h4>${(a.none||isEmpty)?`<p class="about">${esc(a.none||'Nothing needs attention yet.')}</p>`:`<div class="attn">${IC.danger}<div><b>${rich(a.title)}</b>${a.action?`<a class="link" href="#">${esc(a.action)}</a>`:''}</div></div>`}</div>`)}
  if(x.shortcuts)g.push(`<div class="grp"><h4>Shortcuts</h4>${x.shortcuts.map(go).join('')}</div>`);
  if(x.related)g.push(`<div class="grp"><h4>Related</h4>${x.related.map(go).join('')}</div>`);
  if(x.about)g.push(`<div class="grp"><h4>About</h4><p class="about">${rich(x.about)}</p></div>`);
  if(!g.length)return '';
  const cut=Math.min(2,g.length-1)||g.length, top=g.slice(0,cut), rest=g.slice(cut);
  return `<div class="ptop${rest.length?'':' only'}">${top.join('')}</div>${rest.length?`<div class="prest">${rest.join('')}</div>`:''}`;
}
function header(p){
  return `<div class="head"><div><h3>${esc(p.title)}${p.status?badge(p.status):''}</h3>${p.description?`<p>${rich(p.description)}</p>`:''}</div><div class="acts">${(p.actions||[]).map(a=>`<button class="btn ${a.kind==='primary'?'primary':a.kind==='danger'?'danger':'outline'}">${esc(a.label)}</button>`).join('')}</div></div>`
   +(p.tabs?`<div class="ptabs">${p.tabs.map((t,i)=>`<span class="${i===(p.tabActive||0)?'on':''}">${esc(t.label||t)}${t.count!=null?`<em class="num">${esc(t.count)}</em>`:''}</span>`).join('')}</div>`:'')
   +(p.steps?`<div class="steps">${p.steps.map((t,i)=>`${i?'<i></i>':''}<span class="${i<(p.stepActive||0)?'done':i===(p.stepActive||0)?'on':''}"><b>${i+1}</b>${esc(t)}</span>`).join('')}</div>`:'');
}
function render(p,st){
  if(p.template==='redirect')return `<div class="bespoke"><b>This route only redirects</b>${esc(p.exemptReason||'It sends the visitor to another page and draws nothing of its own.')}</div>`;
  if(p.template==='exempt')return header(p)+`<div class="bespoke"><b>Keeps its own layout</b>${esc(p.exemptReason||'')}</div>`;
  const isEmpty=st==='empty'&&p.empty;
  const secs=(p.sections||[]).map((s,i)=>section(s,isEmpty&&i===0?p.empty:null));
  const main=isEmpty?secs.slice(0,1).join(''):secs.join('');
  const pn=panel(p,isEmpty);
  const grid=`<div class="grid${pn?'':' solo'}${p.template==='form'?' narrowmain':''}"><div class="mainc">${main}</div>${pn}</div>`;
  if(p.template==='settings'&&p.settingsNav)return header(p)+`<div class="setnav"><nav>${p.settingsNav.map(n=>`<span class="${n===p.settingsNavActive?'on':''}">${esc(n)}</span>`).join('')}</nav>${grid}</div>`;
  return header(p)+grid;
}

const slug=p=>'p-'+p.route.replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
let cur=0,st='full',filter='';
function draw(){
  const p=PAGES[cur];
  document.getElementById('route').textContent=p.route+'  ·  '+NAME[p.template];
  document.getElementById('crumbs').innerHTML=(p.crumbs||[p.title]).map((c,i,a)=>i===a.length-1?`<b>${esc(c)}</b>`:esc(c)).join(' &nbsp;/&nbsp; ');
  document.getElementById('mock').innerHTML=render(p,st);
  const n=document.getElementById('note');n.hidden=!p.notes;n.innerHTML=p.notes?`<b>Honest note:</b> ${esc(p.notes)}`:'';
  const eb=document.querySelector('#state [data-v="empty"]');eb.disabled=!p.empty;
  document.querySelectorAll('#state button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===(p.empty?st:'full')));
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.i==cur));
  document.getElementById('sel').value=cur;
}
function nav(){
  const groups={};PAGES.forEach((p,i)=>{if(filter&&!(p.title+' '+p.route).toLowerCase().includes(filter))return;(groups[p.group]=groups[p.group]||[]).push(i)});
  document.getElementById('nav').innerHTML=Object.entries(groups).map(([g,is])=>`<h2>${esc(g)}</h2>${is.map(i=>`<a href="#${slug(PAGES[i])}" data-i="${i}"><span>${esc(PAGES[i].navLabel||PAGES[i].title)}</span><i>${TAG[PAGES[i].template]}</i></a>`).join('')}`).join('');
  document.querySelectorAll('#nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.i==cur));
}
function fromHash(){const h=location.hash.slice(1);const i=PAGES.findIndex(p=>slug(p)===h);if(i>=0)cur=i;draw()}
const t={};PAGES.forEach(p=>t[p.template]=(t[p.template]||0)+1);
const noPanel=PAGES.filter(p=>['list','detail','form'].includes(p.template)&&!p.panel).length;
document.getElementById('tally').innerHTML=`<span>${PAGES.length} pages</span>`+Object.entries(t).map(([k,v])=>`<span>${v} ${NAME[k].toLowerCase()}</span>`).join('')+`<span>${noPanel} without a side panel</span>`+`<span>${PAGES.filter(p=>p.notes).length} with an honest note</span>`;
document.getElementById('sel').innerHTML=PAGES.map((p,i)=>`<option value="${i}">${esc(p.group)}: ${esc(p.navLabel||p.title)}</option>`).join('');
document.getElementById('sel').addEventListener('change',e=>{cur=+e.target.value;location.hash=slug(PAGES[cur])});
document.getElementById('q').addEventListener('input',e=>{filter=e.target.value.trim().toLowerCase();nav()});
document.getElementById('state').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;st=b.dataset.v;draw()});
document.getElementById('look').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LOOK=b.dataset.v;const f=document.getElementById('frame');f.classList.toggle('rf',LOOK!=='plain');f.classList.toggle('sg',LOOK==='sg');draw();document.querySelectorAll('#look button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
document.getElementById('prev').addEventListener('click',()=>{cur=(cur-1+PAGES.length)%PAGES.length;location.hash=slug(PAGES[cur])});
document.getElementById('next').addEventListener('click',()=>{cur=(cur+1)%PAGES.length;location.hash=slug(PAGES[cur])});
document.getElementById('mock').addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault()});
addEventListener('hashchange',fromHash);
nav();fromHash();
</script>
