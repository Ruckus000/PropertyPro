# Integration Tests — WHAT RUNS AND WHY IT MATTERS
#
# This job is the required merge context `Integration Tests` AND the
# production-deploy gate: `deploy.yml` waits for it on the CI run's head_sha,
# so a red or over-tight floor here blocks merges and automatic deploys
# repo-wide until a manual `workflow_dispatch` escape hatch.
#
# It runs two suites against a disposable vanilla-Postgres service container:
#   1. `pnpm exec vitest run --config apps/web/vitest.integration.config.ts`
#      — the apps/web integration suite (the step the floor below governs).
#   2. the packages/db RLS pair (rls-policies + pipeline-and-transactions),
#      scoped to two files on purpose — see the step comment.
#
# EXECUTED-COUNT FLOOR (TST-06) — PRINT-ONLY, NOT ARMED (plan ledger D15–D17,
# human-confirmed 2026-09-23). The "Run integration tests" step also emits a
# vitest JSON report (/tmp/vitest-integration.json); the post-step parses it
# and PRINTS executed / collected / skipped / todo / pending against the
# number declared in apps/web/__tests__/integration/ci-integration-floor.json.
# It does not fail the job. Arming (turning the print into ::error:: + exit 1)
# is allowed ONLY after a GREEN run on the branch has printed the executed
# count, and then the floor must be set to that CI-printed number — never a
# local measurement and never the audit's "52", which counted FILES.
#
# Why an EXECUTED floor exists when vitest 3.2.4 already exits 1 on zero
# collection: the silent-green shape left is files being COLLECTED and then
# collapse to zero EXECUTED blocks (a `describe.skip` at file scope, a global
# env gate flipped to always-skip), which reports `Test Files 54 passed` and
# exit 0 while running nothing. Only counting executed assertions catches it.
# The pattern is ported from the e2e workflow's spec-count assertion; the
# bucket mapping differs because vitest's JSON report has NO separate flaky
# bucket (see the step comment) while Playwright's does.

name: Integration Tests

on:
  pull_request:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'
  push:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # AWS ECR Public's mirror of the Docker Hub official image, NOT a
        # third-party rebuild — `docker/library/*` on public.ecr.aws is the
        # official-images mirror, so this is the same artifact by a second route.
        #
        # This job is a REQUIRED status check, so its service container is on the
        # critical path of every merge in the repo. Pulling it from Docker Hub
        # anonymously made a Docker Hub blip block all merges: observed as three
        # consecutive `Get "https://registry-1.docker.io/v2/": context deadline
        # exceeded` failures, which failed the required check on an unrelated PR.
        image: public.ecr.aws/docker/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propertypro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertypro_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/propertypro_test
      PROPERTYPRO_SEED_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stub Supabase primitives
        # Single source of truth, shared with the local runner
        # (scripts/local-test-db.sh) so "green locally" == "green in CI".
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/local-supabase-stub.sql

      - name: Build packages
        run: pnpm --filter @propertypro/shared --filter @propertypro/email --filter @propertypro/db --filter @propertypro/api-contract build

      - name: Run migrations
        run: pnpm --filter @propertypro/db db:migrate

      - name: Reconcile table privileges
        # AFTER migrations: the stub's ALTER DEFAULT PRIVILEGES grants every
        # table the migrations just created, so production's revocations have to
        # be re-applied now those tables exist.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/local-supabase-post-migrate.sql

      # The default reporter stays so the log is still readable; `json` is
      # added alongside it and writes ONLY to /tmp via the dot-notation
      # outputFile (a bare --outputFile would make every reporter write there).
      # Single `run:` command, no pipes — the step conclusion IS vitest's own
      # exit code (see .claude/rules/verification.md: $? after a pipe is the
      # LAST command's status).
      - name: Run integration tests
        id: tests
        run: >-
          pnpm exec vitest run --config apps/web/vitest.integration.config.ts
          --reporter=default --reporter=json
          --outputFile.json=/tmp/vitest-integration.json

      # TST-06 — EXECUTED-count floor. PRINT-ONLY, NOT ARMED (plan ledger
      # D15–D17, human-confirmed 2026-09-23): this step must not fail the job.
      # Arming is a separate, evidence-gated change — see the file header and
      # apps/web/__tests__/integration/ci-integration-floor.json.
      #
      # A genuine test failure needs no re-raise here: when vitest exits
      # non-zero the `tests` step is already red, and this step runs anyway
      # (conclusion == 'failure' is in the gate) purely to print the buckets of
      # the failed run for diagnosis. When the floor IS armed, the ordering
      # rule from the plan still holds: an actual failure outranks the floor.
      #
      # Gate mirrors the e2e workflow's lesson: `always() &&` is REQUIRED — a
      # custom `if:` without a status function gets an implicit success()
      # ANDed on, and the conclusion check narrows it back to "vitest actually
      # ran", so an install/migrate failure does not get a misleading second
      # red X about a missing report.
      #
      # Bucket mapping, VERIFIED against the vitest 3.2.4 JsonReporter source
      # (StatusMap + logTasks), not assumed: the JSON report has NO separate
      # flaky bucket. A test that fails and passes on retry ends in
      # result.state "pass" and lands in `passed`, so executed = passed +
      # failed is complete even with retries on. skipped / todo / pending are
      # the not-executed buckets; an unknown state also falls back to
      # "skipped". (The Playwright report the e2e step reads DOES have a
      # fourth `flaky` stats bucket — omitting it there was required; the
      # asymmetry here is vitest-vs-Playwright, not an omission.)
      #
      # Skips are printed by name as a warning, never refused: the suite has
      # env-conditional self-skips at HEAD — measured locally at the
      # implementation commit (2026-09-23): 54 files collected, 379 tests,
      # 377 executed, 2 skipped — both in
      # apps/web/__tests__/integration/auth/password-reset-login.integration.test.ts,
      # which uses describe.skip without a Supabase Auth environment, exactly
      # what CI's vanilla-Postgres service container provides. A hard
      # skipped>0 refusal would be red on day one (the executed floor already
      # catches the mass-skip failure this guards).
      - name: Report integration executed-test floor (print-only)
        if: always() && (steps.tests.conclusion == 'success' || steps.tests.conclusion == 'failure')
        run: |
          node -e '
            const fs = require("fs");
            const REPORT = "/tmp/vitest-integration.json";
            const FLOOR_FILE = "apps/web/__tests__/integration/ci-integration-floor.json";
            if (!fs.existsSync(REPORT)) {
              // On arming, this becomes ::error:: + exit 1 (a run that cannot
              // produce a report has no evidence of coverage): see e2e.yml.
              console.error("::warning::no vitest JSON report at " + REPORT + " — the run died before the json reporter wrote one (crash/timeout). Floor is PRINT-ONLY, so not failing.");
              process.exit(0);
            }
            let report;
            try {
              report = JSON.parse(fs.readFileSync(REPORT, "utf8"));
            } catch (e) {
              console.error("::warning::vitest JSON report unparseable (" + e.message + "). Floor is PRINT-ONLY, so not failing.");
              process.exit(0);
            }
            const assertions = (report.testResults ?? []).flatMap((f) => f.assertionResults ?? []);
            const count = (status) => assertions.filter((a) => a.status === status).length;
            const passed = count("passed");
            const failed = count("failed");
            const skipped = count("skipped");
            const todo = count("todo");
            const pending = count("pending");
            const executed = passed + failed;
            const collected = assertions.length;
            let floor = null;
            let floorErr = null;
            try {
              floor = JSON.parse(fs.readFileSync(FLOOR_FILE, "utf8")).expectedExecutedCount;
            } catch (e) {
              floorErr = e.message;
            }
            console.log("integration floor (print-only): executed=" + executed + " collected=" + collected + " passed=" + passed + " failed=" + failed + " skipped=" + skipped + " todo=" + todo + " pending=" + pending + " declaredFloor=" + (floorErr ? "UNREADABLE(" + floorErr + ")" : String(floor)));
            if (skipped > 0) {
              // Name them: a new skip that was not there at measurement time is
              // the earliest visible symptom of the failure mode this guards.
              const names = (report.testResults ?? []).flatMap((f) =>
                (f.assertionResults ?? []).filter((a) => a.status === "skipped" || a.status === "todo" || a.status === "pending")
                  .map((a) => String(f.name ?? "").split("/").slice(-3).join("/") + " :: " + a.fullName)
              );
              console.error("::warning::" + skipped + " test(s) NOT executed (skipped/todo/pending): " + names.join(" ; "));
            }
            if (typeof floor === "number" && executed < floor) {
              // WHEN ARMED (D16, evidence-gated): this block becomes
              // ::error:: + process.exit(1). Until then it only announces.
              console.error("::warning::executed=" + executed + " is BELOW the declared floor " + floor + " in " + FLOOR_FILE + " (floor is PRINT-ONLY — not failing the job; see the header of this workflow for the arming rule).");
            }
            process.exit(0);
          '

      - name: Run database RLS policy tests
        # packages/db has its own integration config that no workflow ever
        # invoked, so this suite — the only end-to-end proof that tenant
        # isolation holds at the DATABASE layer rather than just the app layer —
        # ran nowhere. DATABASE_URL and DIRECT_URL are already set at job level,
        # which the suite requires to not skip itself.
        #
        # Scoped to this ONE file on purpose. The rest of packages/db's
        # integration config has pre-existing failures unrelated to RLS
        # (seed-demo / reset-demo / schema-gate0 need seeded demo data;
        # document-access, pm-portfolio-unsafe, reconcile-auth-user-id and
        # audit-log-append-only-db fail on this vanilla-Postgres harness).
        # Enabling all of it here would land CI red on day one and get this step
        # reverted, taking the RLS coverage with it. Widening the glob is its own
        # task, tracked separately.
        #
        # pipeline-and-transactions rides along: it needs only a bare Postgres
        # and pins the patched postgres.js (patches/postgres@3.4.8.patch), whose
        # loss would make every db.transaction throw UNSAFE_TRANSACTION.
        run: >-
          pnpm --filter @propertypro/db exec vitest run
          --config vitest.integration.config.ts
          __tests__/rls-policies.integration.test.ts
          __tests__/pipeline-and-transactions.integration.test.ts
