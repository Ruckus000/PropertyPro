# Integration Tests — WHAT RUNS AND WHY IT MATTERS
#
# This job is the required merge context `Integration Tests` AND the
# production-deploy gate: `deploy.yml` waits for it on the CI run's head_sha,
# so a red or over-tight floor here blocks merges and automatic deploys
# repo-wide until a manual `workflow_dispatch` escape hatch.
#
# It runs two suites against a disposable vanilla-Postgres service container:
#   1. `pnpm exec vitest run --config apps/web/vitest.integration.config.ts`
#      — the apps/web integration suite.
#   2. the packages/db integration config, whole — no file list, no denylist
#      (see the step comment).
#
# EXECUTED-COUNT FLOORS (TST-06) — ARMED. Each suite's run step also emits a
# vitest JSON report, and an assert step after it runs
# scripts/assert-vitest-executed-floor.ts, which counts EXECUTED tests and FAILS
# the job when that is below the suite's `expectedExecutedCount`:
#   - apps/web:    apps/web/__tests__/integration/ci-integration-floor.json (491)
#   - packages/db: packages/db/__tests__/ci-integration-floor.json (272)
# Each value is the executed count PRINTED by the green main run named in its
# file — never a local measurement, and never the audit's "52", which counted
# FILES. Removing an integration test means lowering that suite's floor in the
# same PR; adding tests needs no change (it is a floor, not an equality).
#
# Why an EXECUTED floor exists when vitest 3.2.4 already exits 1 on zero
# collection: the silent-green shape left is files being COLLECTED and then
# collapse to zero EXECUTED blocks (a `describe.skip` at file scope, a global
# env gate flipped to always-skip — every packages/db file gates on
# DATABASE_URL), which reports `Test Files N passed` and exit 0 while running
# nothing. Only counting executed tests catches it. The ordering rule (a real
# failure outranks the floor), the refusals and the vitest bucket mapping are
# documented in the script's header and pinned by
# scripts/__tests__/assert-vitest-executed-floor.test.ts.

name: Integration Tests

on:
  pull_request:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'
  push:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'

permissions:
  contents: read
  # Pull the Postgres service image from this repo's GHCR package.
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # The Docker Hub official image (via AWS ECR Public's official-images
        # mirror, `docker/library/*`), copied byte-for-byte into this repo's GHCR
        # package by ci-image-mirror.yml — the digest below IS upstream's.
        #
        # This job is the production-deploy gate (it is NOT a required merge
        # check — measured 2026-09-28), so its service container is on the
        # critical path of every deploy. Both anonymous pull routes have failed it: Docker Hub as three
        # consecutive `Get "https://registry-1.docker.io/v2/": context deadline
        # exceeded`, then ECR Public on 2026-09-27 as `toomanyrequests: Data limit
        # exceeded` twice (runs 36317688530 on main — which held the deploy — and
        # 36343071278). Anonymous quota is per source IP and runners share IPs.
        # So: pull AUTHENTICATED, from GHCR, with GITHUB_TOKEN (`packages: read`
        # above). To move the pin, let postgres-digest-bump.yml do it — it
        # mirrors the new digest before proposing it.
        image: ghcr.io/ruckus000/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propertypro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertypro_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/propertypro_test
      PROPERTYPRO_SEED_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stub Supabase primitives
        # Single source of truth, shared with the local runner
        # (scripts/local-test-db.sh) so "green locally" == "green in CI".
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/local-supabase-stub.sql

      - name: Build packages
        run: pnpm --filter @propertypro/shared --filter @propertypro/email --filter @propertypro/db --filter @propertypro/api-contract build

      - name: Run migrations
        run: pnpm --filter @propertypro/db db:migrate

      - name: Reconcile table privileges
        # AFTER migrations: the stub's ALTER DEFAULT PRIVILEGES grants every
        # table the migrations just created, so production's revocations have to
        # be re-applied now those tables exist.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/local-supabase-post-migrate.sql

      # The default reporter stays so the log is still readable; `json` is
      # added alongside it and writes ONLY to /tmp via the dot-notation
      # outputFile (a bare --outputFile would make every reporter write there).
      # Single `run:` command, no pipes — the step conclusion IS vitest's own
      # exit code (see .claude/rules/verification.md: $? after a pipe is the
      # LAST command's status).
      - name: Run integration tests
        id: tests
        run: >-
          pnpm exec vitest run --config apps/web/vitest.integration.config.ts
          --reporter=default --reporter=json
          --outputFile.json=/tmp/vitest-integration.json

      # TST-06 — EXECUTED-count floor for apps/web (see the file header).
      #
      # Gate mirrors the e2e workflow's lesson: `always() &&` is REQUIRED — a
      # custom `if:` without a status function gets an implicit success()
      # ANDed on, and the conclusion check narrows it back to "vitest actually
      # ran", so an install/migrate failure does not get a misleading second
      # red X about a missing report. TESTS_CONCLUSION is what lets the script
      # stand down when the test step is already red.
      #
      # Expected skips (named as a warning, never refused): the two
      # password-reset-login cases, which need Supabase Auth.
      - name: Assert integration executed-test floor
        if: always() && (steps.tests.conclusion == 'success' || steps.tests.conclusion == 'failure')
        env:
          TESTS_CONCLUSION: ${{ steps.tests.conclusion }}
        run: >-
          pnpm exec tsx scripts/assert-vitest-executed-floor.ts
          --label apps/web
          --report /tmp/vitest-integration.json
          --floor-file apps/web/__tests__/integration/ci-integration-floor.json

      - name: Run packages/db integration tests
        id: db-tests
        # packages/db has its own integration config. This step used to run a
        # named-file list of it, and every file left off that list rotted unseen
        # (document-access asserted on the retired `cam` role; six more broke
        # on fixture and schema drift). It now runs the WHOLE config, with no
        # file list and no denylist, so a new
        # packages/db/__tests__/*.integration.test.ts runs here by default.
        # Do not reintroduce an --exclude to make this green; fix the file.
        # DATABASE_URL and DIRECT_URL are already set at job level, which the
        # suite requires to not skip itself.
        #
        # What this covers that nothing else does: rls-policies (tenant
        # isolation at the DATABASE layer, not just the app layer),
        # pipeline-and-transactions (pins patches/postgres@3.4.8.patch, whose
        # loss would make every db.transaction throw UNSAFE_TRANSACTION), the
        # compliance_audit_log append-only trigger, the demo seed/reset and
        # seed-community safety nets (Supabase Storage is an in-process HTTP
        # double, __tests__/helpers/supabase-http-double.ts), document access,
        # the scoped client, pagination and the PM portfolio query.
        #
        # Expected skips (env-gated, measured 2026-10-04): seed-demo's
        # Stripe-linkage case (no STRIPE_SECRET_KEY), one invitation-flow case,
        # and supabase-storage (both need real Supabase).
        #
        # The JSON report feeds the floor step below. Single command, no pipes,
        # so the step conclusion IS vitest's exit code.
        run: >-
          pnpm --filter @propertypro/db exec vitest run
          --config vitest.integration.config.ts
          --reporter=default --reporter=json
          --outputFile.json=/tmp/vitest-db-integration.json

      # TST-06 — EXECUTED-count floor for packages/db (see the file header).
      # Same gate and ordering as the apps/web floor step. Expected skips: the
      # seed-demo Stripe case, one invitation-flow case and supabase-storage.
      - name: Assert packages/db executed-test floor
        if: always() && (steps.db-tests.conclusion == 'success' || steps.db-tests.conclusion == 'failure')
        env:
          TESTS_CONCLUSION: ${{ steps.db-tests.conclusion }}
        run: >-
          pnpm exec tsx scripts/assert-vitest-executed-floor.ts
          --label packages/db
          --report /tmp/vitest-db-integration.json
          --floor-file packages/db/__tests__/ci-integration-floor.json
