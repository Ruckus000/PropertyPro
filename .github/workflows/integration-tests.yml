name: Integration Tests

on:
  pull_request:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'
  push:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # AWS ECR Public's mirror of the Docker Hub official image, NOT a
        # third-party rebuild — `docker/library/*` on public.ecr.aws is the
        # official-images mirror, so this is the same artifact by a second route.
        #
        # This job is a REQUIRED status check, so its service container is on the
        # critical path of every merge in the repo. Pulling it from Docker Hub
        # anonymously made a Docker Hub blip block all merges: observed as three
        # consecutive `Get "https://registry-1.docker.io/v2/": context deadline
        # exceeded` failures, which failed the required check on an unrelated PR.
        image: public.ecr.aws/docker/library/postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propertypro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertypro_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/propertypro_test
      PROPERTYPRO_SEED_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stub Supabase primitives
        # Single source of truth, shared with the local runner
        # (scripts/local-test-db.sh) so "green locally" == "green in CI".
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/local-supabase-stub.sql

      - name: Build packages
        run: pnpm --filter @propertypro/shared --filter @propertypro/email --filter @propertypro/db --filter @propertypro/api-contract build

      - name: Run migrations
        run: pnpm --filter @propertypro/db db:migrate

      - name: Reconcile table privileges
        # AFTER migrations: the stub's ALTER DEFAULT PRIVILEGES grants every
        # table the migrations just created, so production's revocations have to
        # be re-applied now those tables exist.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/sql/local-supabase-post-migrate.sql

      - name: Run integration tests
        run: pnpm exec vitest run --config apps/web/vitest.integration.config.ts

      - name: Run database RLS policy tests
        # packages/db has its own integration config that no workflow ever
        # invoked, so this suite — the only end-to-end proof that tenant
        # isolation holds at the DATABASE layer rather than just the app layer —
        # ran nowhere. DATABASE_URL and DIRECT_URL are already set at job level,
        # which the suite requires to not skip itself.
        #
        # Scoped to this ONE file on purpose. The rest of packages/db's
        # integration config has pre-existing failures unrelated to RLS
        # (seed-demo / reset-demo / schema-gate0 need seeded demo data;
        # document-access, pm-portfolio-unsafe, reconcile-auth-user-id and
        # audit-log-append-only-db fail on this vanilla-Postgres harness).
        # Enabling all of it here would land CI red on day one and get this step
        # reverted, taking the RLS coverage with it. Widening the glob is its own
        # task, tracked separately.
        run: >-
          pnpm --filter @propertypro/db exec vitest run
          --config vitest.integration.config.ts
          __tests__/rls-policies.integration.test.ts
