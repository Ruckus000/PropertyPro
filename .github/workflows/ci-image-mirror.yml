name: CI Image Mirror

# Copies the container images CI depends on into this repo's GitHub Container
# Registry packages, so the jobs that use them pull AUTHENTICATED from GHCR
# instead of anonymously from a shared-IP registry. Two jobs:
#   - mirror-postgres-image  — the pinned Postgres service container
#                              (integration-tests.yml, tenant-isolation-game-day.yml;
#                              digest in scripts/ci/postgres-image-digest)
#   - mirror-supabase-images — the local Supabase stack `supabase start` runs
#                              (e2e.yml, stripe-e2e.yml); see the job comment.
#
# Why: integration-tests.yml is the production-deploy gate (deploy.yml waits on it;
# it is NOT a required merge check — measured 2026-09-28, see CLAUDE.md).
# Its service container used to come anonymously from public.ecr.aws, and on
# 2026-09-27 that failed twice in "Initialize containers" with
# `toomanyrequests: Data limit exceeded` — the anonymous quota is per source IP,
# and GitHub-hosted runners share IPs. No test ran either time, and the first
# failure (run 36317688530, main @ 479a4be6) held the production deploy until a
# manual re-run. Docker Hub had failed the same way before that (see the comment
# on the service in integration-tests.yml).
#
# What this does NOT change: the image. `skopeo copy --all --preserve-digests`
# copies the multi-arch index byte-for-byte, so the GHCR digest IS the pinned
# upstream digest, and the job below refuses to pass unless it can read that
# exact digest back from GHCR. The upstream stays public.ecr.aws's mirror of the
# Docker Hub official image; only the place our runners pull from moves.
#
# The package is created by GITHUB_TOKEN from this repo's workflow, which links
# it to the repo and grants this repo's workflows access. Consumers therefore
# need `packages: read` and service `credentials:` — no new secrets.
#
# Triggers:
#   - push touching a file that carries a pin (scripts/ci/postgres-image-digest,
#     or a SUPABASE_CLI_VERSION): a branch that changes a pin mirrors it before (or
#     while) its PR's checks try to pull it. Any branch, not just main, for
#     exactly that reason. Both jobs are idempotent.
#   - workflow_dispatch: manual re-mirror.
# postgres-digest-bump.yml mirrors a NEW digest itself before opening its PR,
# because a push made with GITHUB_TOKEN does not trigger this workflow.

on:
  push:
    paths:
      - 'scripts/ci/postgres-image-digest'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/stripe-e2e.yml'
      - '.github/workflows/ci-image-mirror.yml'
      - 'scripts/ci/supabase-images.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror-postgres-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Create/update the ghcr.io/<owner>/postgres package. Scoped to this job.
      packages: write

    env:
      SOURCE_REPO: public.ecr.aws/docker/library/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror the pinned digest to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # The single pin both consumers read (via their `pin` job), and the
          # file postgres-digest-bump.yml moves.
          digests=$(tr -d '[:space:]' < scripts/ci/postgres-image-digest)
          if ! printf '%s' "$digests" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error file=scripts/ci/postgres-image-digest::Not a sha256 digest: '${digests}'"
            exit 1
          fi

          dest_repo="ghcr.io/${OWNER,,}/postgres"
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin

          for digest in $digests; do
            hex="${digest#sha256:}"
            # A tag per digest keeps every mirrored version tagged (never an
            # orphaned untagged version) and lets the bump job add one without
            # moving another. Consumers pull by digest; the tag is bookkeeping.
            dest="${dest_repo}:16-${hex:0:12}"

            if skopeo inspect --raw "docker://${dest_repo}@${digest}" >/dev/null 2>&1; then
              echo "Already mirrored: ${dest_repo}@${digest}"
            else
              echo "Mirroring ${SOURCE_REPO}@${digest} -> ${dest}"
              skopeo copy --all --preserve-digests --retry-times 3 \
                "docker://${SOURCE_REPO}@${digest}" "docker://${dest}"
            fi

            # Fail closed: prove GHCR serves the EXACT pinned bytes. A copy that
            # re-wrote the index would change its digest and every consumer's
            # pull-by-digest would then fail, and with it the deploy gate.
            got="sha256:$(skopeo inspect --raw "docker://${dest_repo}@${digest}" | sha256sum | cut -d' ' -f1)"
            if [ "$got" != "$digest" ]; then
              echo "::error::GHCR returned ${got} for ${digest}"
              exit 1
            fi
            echo "Verified: ${dest_repo}@${digest}"
          done

  # `supabase start` pulls ~12 images from public.ecr.aws/supabase anonymously;
  # the e2e run on main @ 8a4d374e hit `toomanyrequests: Rate exceeded` there
  # and survived only on the CLI's retries. This copies the images for every
  # pinned CLI version into ghcr.io/<owner>/supabase/<name>:<tag>, byte-identical,
  # and the e2e jobs pre-pull from there (scripts/ci/supabase-images.sh).
  #
  # Upstream pins these by TAG, not digest (the CLI's own Dockerfile), so the
  # mirror is copy-once: an existing tag is never overwritten, which freezes the
  # bytes CI runs for a given CLI version.
  mirror-supabase:
    name: mirror-supabase-images
    runs-on: ubuntu-latest
    # Studio alone is ~1 GB per architecture; a cold mirror copies every arch.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror the Supabase images for every pinned CLI version
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # One value per workflow that runs `supabase start`; see the comment
          # on SUPABASE_CLI_VERSION in e2e.yml.
          versions=$(grep -hE '^[[:space:]]*SUPABASE_CLI_VERSION:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$' \
              .github/workflows/e2e.yml .github/workflows/stripe-e2e.yml \
            | sed -E 's/.*:[[:space:]]*//; s/[[:space:]]*$//' | sort -u || true)
          if [ -z "$versions" ]; then
            echo "::error::No SUPABASE_CLI_VERSION found in e2e.yml / stripe-e2e.yml — reformatted?"
            exit 1
          fi

          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin

          for v in $versions; do
            echo "::group::Supabase CLI v${v}"
            scripts/ci/supabase-images.sh mirror "$v" "ghcr.io/${OWNER,,}/supabase"
            echo "::endgroup::"
          done
