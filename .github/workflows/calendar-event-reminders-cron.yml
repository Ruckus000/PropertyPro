name: Calendar Event Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-calendar-event-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke calendar event reminder route
        env:
          CALENDAR_EVENT_REMINDERS_CRON_BASE_URL: ${{ secrets.CALENDAR_EVENT_REMINDERS_CRON_BASE_URL }}
          CALENDAR_EVENT_REMINDERS_CRON_SECRET: ${{ secrets.CALENDAR_EVENT_REMINDERS_CRON_SECRET }}
        run: |
          if [ -z "$CALENDAR_EVENT_REMINDERS_CRON_BASE_URL" ] || [ -z "$CALENDAR_EVENT_REMINDERS_CRON_SECRET" ]; then
            echo "::warning::Skipping calendar event reminders because required secrets are not configured"
            exit 0
          fi

          curl -fsS \
            -X POST \
            "$CALENDAR_EVENT_REMINDERS_CRON_BASE_URL/api/v1/internal/calendar-event-reminders" \
            -H "Authorization: Bearer $CALENDAR_EVENT_REMINDERS_CRON_SECRET" \
            -H "Content-Type: application/json"
