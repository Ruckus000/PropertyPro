name: Calendar Event Reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled workflow: queue rather than overlap, so a slow run never stacks on
# the next tick. cancel-in-progress is false because these POST real work —
# killing one mid-flight is worse than making the next tick wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-calendar-event-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke calendar event reminder route
        env:
          CALENDAR_EVENT_REMINDERS_CRON_BASE_URL: ${{ secrets.CALENDAR_EVENT_REMINDERS_CRON_BASE_URL }}
          CALENDAR_EVENT_REMINDERS_CRON_SECRET: ${{ secrets.CALENDAR_EVENT_REMINDERS_CRON_SECRET }}
        run: |
          if [ -z "$CALENDAR_EVENT_REMINDERS_CRON_BASE_URL" ] || [ -z "$CALENDAR_EVENT_REMINDERS_CRON_SECRET" ]; then
            echo "::warning::Skipping calendar event reminders because required secrets are not configured"
            exit 0
          fi

          # --max-time bounds a hung endpoint (there is no default timeout);
          # --retry covers a transient 5xx or dropped connection.
          curl -fsS \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            -X POST \
            "$CALENDAR_EVENT_REMINDERS_CRON_BASE_URL/api/v1/internal/calendar-event-reminders" \
            -H "Authorization: Bearer $CALENDAR_EVENT_REMINDERS_CRON_SECRET" \
            -H "Content-Type: application/json"
