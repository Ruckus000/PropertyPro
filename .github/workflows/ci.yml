name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verify CSS variable migration
        run: ./scripts/verify-css-var-migration.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Stub URL so @propertypro/db can load at import time. Unit tests never
      # actually connect — they either mock createScopedClient or call pure
      # functions. Real DB access is covered by the integration-tests job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertypro_stub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guards that the seed/reset scripts' real `pnpm` invocations resolve their
      # full import graph (incl. apps/web `@/` aliases). Resolve-only mode exits
      # before any DB work, so the job's stub DATABASE_URL is sufficient — no live
      # DB is contacted. Catches a regression of the --tsconfig wiring that left the
      # Nightly Demo Reset broken for ~4 months.
      - name: Verify seed/reset resolve under their real invocation
        env:
          PROPERTYPRO_SEED_RESOLVE_ONLY: '1'
        run: |
          pnpm reset:demo
          pnpm seed:demo

      - name: Build workspace packages
        run: pnpm --filter '@propertypro/shared' --filter '@propertypro/db' --filter '@propertypro/email' --filter '@propertypro/ui' --filter '@propertypro/theme' --filter '@propertypro/api-contract' build

      - name: Run unit tests with coverage
        working-directory: apps/web
        run: pnpm exec vitest run --coverage

      - name: Run package unit tests
        run: pnpm --filter '@propertypro/shared' --filter '@propertypro/ui' --filter '@propertypro/email' --filter '@propertypro/theme' --filter '@propertypro/db' --filter '@propertypro/api-contract' --filter '@propertypro/tokens' test

      - name: Run admin unit tests
        run: pnpm --filter '@propertypro/admin' test

      - name: Report coverage summary
        if: always()
        run: |
          if [ -f apps/web/coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./apps/web/coverage/coverage-summary.json').total;
              const fmt = (v) => v.pct.toFixed(1) + '%';
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Statements | ' + fmt(c.statements) + ' |');
              console.log('| Branches | ' + fmt(c.branches) + ' |');
              console.log('| Functions | ' + fmt(c.functions) + ' |');
              console.log('| Lines | ' + fmt(c.lines) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi

  no-mock-guard:
    name: no-mock-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify integration tests use no mocks
        run: pnpm exec tsx scripts/verify-no-mocks-in-integration.ts

  migration-ordering:
    name: migration-ordering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The baseline-collision check diffs this branch's journal against
          # origin/main to catch two open PRs claiming the same migration idx or
          # `when`. checkout defaults to fetch-depth 1, which has no origin/main
          # to compare against and would make the check skip with a warning.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration ordering
        run: pnpm exec tsx scripts/verify-migration-ordering.ts

  # This job owns the ONLY production build in CI. The `build` job below used to
  # run an identical `pnpm build` a second time, gated behind every other job,
  # which put ~5min of duplicated work on the critical path. The build lives here
  # rather than there because both the PDF.js smoke test and `pnpm perf:check`
  # read the emitted build output from disk, so they must share a job with it.
  perf-check:
    name: perf-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time env stubs — no live DB needed for bundle size checks.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertypro_stub
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/propertypro_stub
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      # Carried over from the former standalone `build` job so this job's env is
      # a superset of both — the build already succeeded without it, but keeping
      # it means the two builds were provably equivalent before they were merged.
      SUPABASE_SERVICE_ROLE_KEY: placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Next's incremental compiler cache. Turbo reports "0 cached, 8 total" on
      # every run, so both Next apps are otherwise compiled cold each time.
      # turbo.json already excludes .next/cache from the build `outputs`, so this
      # does not fight turbo's own output handling.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/admin/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: pnpm build

      - name: Run PDF.js production smoke test
        env:
          PDFJS_TEST_ENABLED: '1'
        run: pnpm --filter @propertypro/web test:e2e:prod -- e2e/pdfjs-runtime.spec.ts

      - name: Run performance budget check
        run: pnpm perf:check

  # Status-check alias, NOT a second build.
  #
  # `Build` is a required status check on main, so the context name has to keep
  # reporting. The production build itself happens exactly once, in `perf-check`
  # above, which needs the build output in-process for the bundle-size budget.
  #
  # This job previously ran its own identical `pnpm build` (287s) AND declared
  # `needs: [lint, typecheck, test, no-mock-guard, migration-ordering, perf-check]`,
  # so it did not start until ~12min into the run and then rebuilt what
  # perf-check had already built. That cost ~5min of wall clock and ~5min of
  # runner minutes on every single run, for no added signal.
  #
  # To retire this indirection: drop `Build` from main's required status checks
  # and delete this job.
  build:
    name: Build
    needs: [perf-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Production build verified in perf-check
        run: echo "Production build succeeded in the perf-check job."
