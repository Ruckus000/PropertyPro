name: CI

on:
  pull_request:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'
  push:
    branches: [main]
    # Inert paths — a commit touching ONLY these cannot change build or test
    # output, so running the full 31-billed-minute suite on it is pure spend.
    # Measured over the last 60 commits on main: 4 (7%) qualify.
    #
    # `paths-ignore`, deliberately, NOT `paths`. An allowlist silently stops
    # covering anything added later; a denylist fails safe — an unlisted path
    # still runs CI.
    #
    # Deploy interaction: `deploy.yml` fires on `workflow_run: [CI]` for main,
    # so a skipped CI here also means no production deploy for that commit.
    # That is correct — these paths produce no deployable change — but it is
    # why the list must stay strictly inert. Anything that can reach a build
    # artefact does NOT belong here.
    #
    # Markdown is matched at the ROOT only (`*.md`) — deliberately NOT
    # `**/*.md`. apps/web/src/content/legal/{privacy,terms}.md are read at
    # build time by getLegalDoc() to render the public legal pages, and
    # apps/web/src/content/help/**/*.mdx is build input as well. A recursive
    # markdown rule would skip CI on a legal-text-only commit, and a skipped
    # CI on main means deploy.yml never fires — the updated privacy policy or
    # ToS would silently never reach production.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Verify CSS variable migration
        run: ./scripts/verify-css-var-migration.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit Tests
    # SELF-HOSTED ON PULL REQUESTS, GitHub-hosted on pushes to main.
    #
    # The runner is a Lima VM on a MacBook Pro (see
    # .github/self-hosted-runner/README.md). Measured: the identical
    # `vitest run --coverage` over 9,028 tests takes 57s on that host's 14 cores
    # and 974s on a 4-core `ubuntu-latest` runner.
    #
    # `push: main` deliberately stays hosted. A laptop gets closed, and a job
    # with no available runner does not fail — it QUEUES, leaving required
    # checks pending and the PR unmergeable with nothing red. That is the same
    # invisible-block failure mode described in the timeout note below, so
    # merges to main must never depend on the laptop being awake.
    #
    # `vars.CI_RUNNER_LABEL` is the escape hatch: set it to `ubuntu-latest` to
    # fall back instantly. runner-watchdog.yml flips it automatically when the
    # self-hosted runner goes offline. Note that flipping it does NOT
    # re-dispatch already-queued runs — the watchdog re-runs them too.
    runs-on: ${{ github.event_name == 'pull_request' && (vars.CI_RUNNER_LABEL || 'ubuntu-latest') || 'ubuntu-latest' }}
    # 25, not the 15 every other job uses, because this is the ONLY job whose
    # runtime is anywhere near a ceiling.
    #
    # Measured 2026-08-06 over the last 4 green runs, via
    # `gh api repos/Ruckus000/PropertyPro/actions/runs/<id>/jobs`:
    # 18m17s / 18m38s / 18m17s / 13m42s. That is ~1.35x headroom, NOT the ~1.7x
    # implied by the earlier note here (which recorded avg 8.5 / max 12.3 min —
    # accurate when written, badly stale now; the suite has roughly doubled).
    # perf-check, the next longest, is 6m42s-8m01s.
    #
    # Do not raise this again to buy room. On the self-hosted runner this job
    # is expected to land well under 6 min, at which point the value should be
    # RATCHETED DOWN to roughly 2x measured p95 — a 25-minute ceiling on a job
    # that takes 4 means a hang burns 25 minutes of someone's laptop and then
    # reports as cancelled, i.e. invisibly.
    #
    # The failure mode is worth knowing: a job that exceeds `timeout-minutes`
    # is reported as **cancelled**, not failed. `gh pr checks` then shows
    # 12/13 green with nothing red, while the PR sits UNSTABLE and unmergeable
    # — so it reads as a flake rather than a block. It hit a docs-only PR,
    # so nothing about the changed code protects you from it.
    #
    # See apps/web/vitest.shared.ts for the node/jsdom split that got this job
    # down from 17 min in the first place.
    timeout-minutes: 25
    env:
      # Stub URL so @propertypro/db can load at import time. Unit tests never
      # actually connect — they either mock createScopedClient or call pure
      # functions. Real DB access is covered by the integration-tests job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertypro_stub
      # `ubuntu-latest` is UTC / C.UTF-8 and nothing in the repo pins either.
      # ~82 files under apps/web/src use Intl/toLocale*, so an inherited runner
      # timezone silently rewrites date assertions. Set here as well as in the
      # VM image so the guarantee survives a runner rebuild.
      TZ: UTC
      LANG: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guards that the seed/reset scripts' real `pnpm` invocations resolve their
      # full import graph (incl. apps/web `@/` aliases). Resolve-only mode exits
      # before any DB work, so the job's stub DATABASE_URL is sufficient — no live
      # DB is contacted. Catches a regression of the --tsconfig wiring that left the
      # Nightly Demo Reset broken for ~4 months.
      - name: Verify seed/reset resolve under their real invocation
        env:
          PROPERTYPRO_SEED_RESOLVE_ONLY: '1'
        run: |
          pnpm reset:demo
          pnpm seed:demo

      - name: Build workspace packages
        run: pnpm --filter '@propertypro/shared' --filter '@propertypro/db' --filter '@propertypro/email' --filter '@propertypro/ui' --filter '@propertypro/theme' --filter '@propertypro/api-contract' build

      # Size the vitest fork pool to the machine this job actually landed on.
      #
      # vitest defaults to `availableParallelism() - 1`: 3 forks on a 4-core
      # hosted runner, 7 on the 8-vCPU Lima VM. The VM can be running more than
      # one heavy job at a time, so the default over-subscribes it and tests
      # start failing on the 5s default timeout without ever asserting anything
      # about timing. That is exactly what the shadow phase caught — demo-token
      # (#912), then contracts-route:191 and esign-route:189 (#916), three
      # symptoms of one cause.
      #
      # Keyed on `runner.environment` rather than `vars.CI_RUNNER_LABEL` on
      # purpose: this follows where the job REALLY ran, so it cannot drift from
      # the `runs-on` expression and stays correct if runner-watchdog flips the
      # label between queue time and run time. Hosted runs set nothing at all
      # and keep vitest's stock defaults.
      #
      # `runner` context is not available in a job-level `env:` block, only at
      # step level — hence exporting through $GITHUB_ENV here instead.
      - name: Size the vitest fork pool to the runner
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            echo "VITEST_MAX_FORKS=4" >> "$GITHUB_ENV"
            echo "VITEST_EXTRA_ARGS=--testTimeout=15000" >> "$GITHUB_ENV"
            echo "self-hosted: forks pinned to 4, testTimeout 15000ms"
          else
            echo "github-hosted: vitest defaults (forks $(( $(nproc) - 1 )), testTimeout 5000ms)"
          fi

      - name: Run unit tests with coverage
        working-directory: apps/web
        # $VITEST_EXTRA_ARGS is deliberately unquoted: empty on hosted runners,
        # where it must expand to no argument at all rather than an empty one.
        run: pnpm exec vitest run --coverage $VITEST_EXTRA_ARGS

      - name: Run package unit tests
        run: pnpm --filter '@propertypro/shared' --filter '@propertypro/ui' --filter '@propertypro/email' --filter '@propertypro/theme' --filter '@propertypro/db' --filter '@propertypro/api-contract' --filter '@propertypro/tokens' test

      - name: Run admin unit tests
        run: pnpm --filter '@propertypro/admin' test

      - name: Report coverage summary
        if: always()
        run: |
          if [ -f apps/web/coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./apps/web/coverage/coverage-summary.json').total;
              const fmt = (v) => v.pct.toFixed(1) + '%';
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Statements | ' + fmt(c.statements) + ' |');
              console.log('| Branches | ' + fmt(c.branches) + ' |');
              console.log('| Functions | ' + fmt(c.functions) + ' |');
              console.log('| Lines | ' + fmt(c.lines) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi

  no-mock-guard:
    name: no-mock-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify integration tests use no mocks
        run: pnpm exec tsx scripts/verify-no-mocks-in-integration.ts

  migration-ordering:
    name: migration-ordering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The baseline-collision check diffs this branch's journal against
          # origin/main to catch two open PRs claiming the same migration idx or
          # `when`. checkout defaults to fetch-depth 1, which has no origin/main
          # to compare against and would make the check skip with a warning.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration ordering
        run: pnpm exec tsx scripts/verify-migration-ordering.ts

  # This job owns the ONLY production build in CI. The `build` job below used to
  # run an identical `pnpm build` a second time, gated behind every other job,
  # which put ~5min of duplicated work on the critical path. The build lives here
  # rather than there because both the PDF.js smoke test and `pnpm perf:check`
  # read the emitted build output from disk, so they must share a job with it.
  perf-check:
    name: perf-check
    # Self-hosted on PRs, hosted on pushes to main — same rationale as the
    # `test` job above. Cut over AFTER `test`: this job is the most
    # environment-sensitive of the two (it is the only production build, and
    # the required `Build` status check hangs off its result), so it carries
    # the largest blast radius.
    runs-on: ${{ github.event_name == 'pull_request' && (vars.CI_RUNNER_LABEL || 'ubuntu-latest') || 'ubuntu-latest' }}
    # 25, raised from 15 on 2026-08-16. Not headroom for growth — headroom for a
    # runner that intermittently runs this job 3x slow.
    #
    # Measured 2026-08-15/16 across consecutive runs of the same workload:
    #   pushes to main (hosted):  4.0 / 4.5 / 4.5 / 4.7 / 4.8 / 4.8 / 5.0 / 5.2
    #   PRs (self-hosted):        4.8 / 5.0 / 5.0 / 5.5 / 5.9 / 6.6 / 7.7
    #   degraded, same tree:      15m30s (KILLED by the old 15) then 6m31s on the
    #                             immediate re-run; another at 14m17s
    # The short jobs on those degraded runs were unaffected (Lint 1.1 vs 1.2 min),
    # so this is the runner, not the workload. #969 measured Unit Tests at 23.7
    # min against a 3.8-7.5 min norm in the same window.
    #
    # The tradeoff the `test` job's note warns about applies here and is accepted
    # deliberately: at 25 a genuine HANG now burns 25 minutes and reports as
    # *cancelled* rather than failed. That is the lesser evil against a ~5 min job
    # being killed at 15 and reading as a red PR — which then costs a re-run and
    # invites the wrong diagnosis (it did: #968's failure was read as a code
    # problem before the durations were compared against passing runs).
    #
    # RATCHET THIS DOWN to ~2x p95 (i.e. back toward 15) once the runner stops
    # producing 3x outliers. Raising it is a stopgap for the symptom; the cause
    # is unfixed.
    timeout-minutes: 25

    env:
      # See the `test` job — same reason, same guarantee.
      TZ: UTC
      LANG: C.UTF-8
      # Build-time env stubs — no live DB needed for bundle size checks.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propertypro_stub
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/propertypro_stub
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      # Deliberately NOT setting SUPABASE_SERVICE_ROLE_KEY. The retired `build`
      # job set it, but this job's build has always succeeded without it — which
      # proves nothing calls createAdminClient() at build time. That function
      # throws when the var is missing (packages/db/src/supabase/admin.ts), so
      # leaving it unset keeps a loud tripwire: a future build-time call fails
      # the build instead of silently constructing a client with a bogus key.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Next's incremental compiler cache. Turbo reports "0 cached, 8 total" on
      # every run, so both Next apps are otherwise compiled cold each time.
      # turbo.json already excludes .next/cache from the build `outputs`, so this
      # does not fight turbo's own output handling.
      #
      # RESTORE on every run, SAVE only on main. A combined `actions/cache` step
      # saves on every run, and because the key carries `github.sha` that is a
      # NEW ~174MB entry each time. At ~30 CI runs/day that is ~5GB/day against
      # GitHub's 10GB per-repo cap, which evicts least-recently-used — and the
      # entries most worth keeping are the ~299MB pnpm caches that make
      # `Install dependencies` take 5s. PR-run caches are also scoped to
      # refs/pull/N/merge and readable only by that same PR, so nearly all of
      # that volume would never be read again. Saving only on main keeps one
      # entry per merge, which every PR can still restore from its base branch.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/.next/cache
            apps/admin/.next/cache
          # `runner.arch` is NOT decorative. `runner.os` is `Linux` on both a
          # GitHub-hosted x64 runner and the self-hosted arm64 VM, so without it
          # the restore-keys prefix would hand an X64 cache — built by
          # @next/swc-linux-x64-gnu — to an ARM64 build. Expect a low hit rate
          # on self-hosted regardless: webpack caches absolute paths, and the
          # workspace path differs from /home/runner/work. That is not a VM
          # fault, so do not go debugging it as one.
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          # Lockfile-scoped only. A bare `nextjs-${{ runner.os }}-` fallback would
          # happily restore a cache built against different dependency versions.
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - name: Save Next.js build cache
        # Only main writes. See the restore step above for why.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/web/.next/cache
            apps/admin/.next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      # The only e2e that runs on a PR, and the list is deliberately short.
      #
      # THE LIST LIVES IN ONE PLACE: `PROD_SAFE_SPECS` in
      # `apps/web/playwright.prod.config.ts`, which the config applies as its
      # `testMatch`. Do NOT re-list spec paths on the command line here — a CLI
      # list overrides `testMatch`, so the two silently diverge and a spec added
      # to the allowlist never actually runs in CI.
      #
      # Those specs share one property that nothing else in `apps/web/e2e` has:
      # they need NO database, NO Supabase Auth and NO seed. That is why they can
      # run in this job, whose `DATABASE_URL` points at a stub that was never
      # started and which deliberately omits `SUPABASE_SERVICE_ROLE_KEY`.
      #
      # The remaining blocks are NOT missing by oversight. They call
      # `/dev/agent-login`, which needs a live GoTrue plus `pnpm seed:demo`, and
      # getting that into a workflow is the actual blocker — not Playwright.
      # docs/audits/2026-08-03-e2e-inventory.md measured the suite end to end;
      # well under half the blocks pass locally, so a CI job covering the rest
      # would be red on day one and stay red. A permanently-red required check is
      # worse than no check — it is how these specs rotted unnoticed in the first
      # place.
      #
      # Before adding a spec to `PROD_SAFE_SPECS`, confirm it passes against a
      # PRODUCTION build with an UNREACHABLE database. Passing under
      # `pnpm test:e2e` proves nothing about this job: that command runs a dev
      # server against a real database, which differs on both axes.
      - name: Run production smoke tests (public pages + PDF.js)
        env:
          PDFJS_TEST_ENABLED: '1'
        run: pnpm --filter @propertypro/web test:e2e:prod

      - name: Run performance budget check
        run: pnpm perf:check

  # Status-check alias, NOT a second build.
  #
  # `Build` is a required status check on main, so the context name has to keep
  # reporting. The production build itself happens exactly once, in `perf-check`
  # above, which needs the build output in-process for the bundle-size budget.
  #
  # This job previously ran its own identical `pnpm build` (287s) AND declared
  # `needs: [lint, typecheck, test, no-mock-guard, migration-ordering, perf-check]`,
  # so it did not start until ~12min into the run and then rebuilt what
  # perf-check had already built. That cost ~5min of wall clock and ~5min of
  # runner minutes on every single run, for no added signal.
  #
  # To retire this indirection: drop `Build` from main's required status checks
  # and delete this job.
  #
  # `if: always()` plus an explicit result assertion, NOT a bare `needs:`.
  # GitHub treats a required check as satisfied when it is "successful, skipped,
  # or neutral". With a bare `needs:`, anything that makes perf-check *skip*
  # (a paths filter, an `if:`, a trigger change) skips this job too — and both
  # perf-check and Build would then report `skipped`, satisfying BOTH required
  # contexts with no production build having run anywhere. Asserting on
  # needs.perf-check.result converts that silent pass into a hard failure.
  build:
    name: Build
    needs: [perf-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the production build succeeded
        run: |
          # Bracket notation, not `needs.perf-check.result` — the job id contains
          # a hyphen, which GitHub's expression parser can read as subtraction.
          if [ "${{ needs['perf-check'].result }}" != "success" ]; then
            echo "::error::perf-check result=${{ needs['perf-check'].result }} — the production build was NOT verified."
            exit 1
          fi
          echo "Production build succeeded in the perf-check job."
