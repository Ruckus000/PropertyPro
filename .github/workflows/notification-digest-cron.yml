name: Notification Digest Processor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled workflow: queue rather than overlap, so a slow run never stacks on
# the next tick. cancel-in-progress is false because these POST real work —
# killing one mid-flight is worse than making the next tick wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-digest-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke digest processor route
        env:
          DIGEST_CRON_BASE_URL: ${{ secrets.DIGEST_CRON_BASE_URL }}
          NOTIFICATION_DIGEST_CRON_SECRET: ${{ secrets.NOTIFICATION_DIGEST_CRON_SECRET }}
        run: |
          if [ -z "$DIGEST_CRON_BASE_URL" ]; then
            echo "Missing DIGEST_CRON_BASE_URL secret"
            exit 1
          fi

          if [ -z "$NOTIFICATION_DIGEST_CRON_SECRET" ]; then
            echo "Missing NOTIFICATION_DIGEST_CRON_SECRET secret"
            exit 1
          fi

          # --max-time bounds a hung endpoint (there is no default timeout);
          # --retry covers a transient 5xx or dropped connection.
          curl -fsS \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            -X POST \
            "$DIGEST_CRON_BASE_URL/api/v1/internal/notification-digests/process" \
            -H "Authorization: Bearer $NOTIFICATION_DIGEST_CRON_SECRET" \
            -H "Content-Type: application/json"
