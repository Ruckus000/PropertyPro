name: Deploy

on:
  # Production deploy only after CI passes on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual trigger. Deploys are otherwise reachable ONLY by landing a commit on
  # main, which makes two ordinary operations awkward: applying a changed Vercel
  # env var (values are baked in at `vercel pull` + `vercel build`, so an existing
  # deployment never picks one up), and re-deploying after an infrastructure-only
  # fix. This repo has previously had production deploys silently blocked for two
  # weeks; not being able to deploy without inventing a commit is what made that
  # slow to recover from.
  workflow_dispatch:
  # PR previews are handled by the native Vercel GitHub integration.

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shared gate for every app's deploy. Extracted into its own job so the
  # Integration Tests check is resolved ONCE per run instead of being duplicated
  # (and re-polled) in each deploy job.
  #
  # The deploy jobs below carry no `if:` of their own — a skipped `needs`
  # dependency skips its dependents, so this condition governs all of them.
  gate:
    name: Require Integration Tests
    # Auto: only when CI actually succeeded. Manual: the operator has decided,
    # and a dispatch carries no workflow_run conclusion to check — without this
    # second branch the dispatch trigger above would be accepted and then
    # silently skip every job.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed by the Integration Tests gate below to read another workflow's runs.
      actions: read

    steps:
      # `Integration Tests` is a required check for MERGING, but it is a separate
      # workflow, and this one triggers on `workflow_run: [CI]` only. So green CI
      # plus red integration-tests used to deploy to production anyway.
      #
      # Gating by adding `Integration Tests` to the `workflows:` trigger list does
      # NOT work: workflow_run fires once PER workflow, each event carries only
      # its own conclusion, and both events land in the same concurrency group
      # (`github.ref` is refs/heads/main either way) with cancel-in-progress
      # false — so the same commit would deploy twice, serially. Instead the CI
      # event stays the single trigger and we resolve the sibling run here.
      - name: Require Integration Tests to have passed for this commit
        # Gates the AUTOMATIC path only. workflow_dispatch is the manual escape
        # hatch that exists *because* this pipeline once silently blocked every
        # production deploy for two weeks; giving it a new way to refuse would
        # recreate exactly that failure mode. A human running it has decided.
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Resolving Integration Tests for $HEAD_SHA"
          deadline=$(( SECONDS + 900 ))

          while :; do
            run_json=$(gh api \
              "repos/$REPO/actions/workflows/integration-tests.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
              --jq '[.workflow_runs[]][0] // {} | {status: (.status // "missing"), conclusion: (.conclusion // "")}' \
              2>/dev/null || echo '{"status":"apierror","conclusion":""}')
            status=$(echo "$run_json" | jq -r .status)
            conclusion=$(echo "$run_json" | jq -r .conclusion)
            echo "  status=$status conclusion=$conclusion"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Integration Tests passed for $HEAD_SHA — proceeding."
                exit 0
              fi
              echo "::error::Integration Tests concluded '$conclusion' for $HEAD_SHA — refusing to deploy."
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              # Absence is NOT success. A required check that never reported is
              # exactly how a skipped check silently satisfies a gate.
              echo "::error::Integration Tests did not complete for $HEAD_SHA within 15m (last status='$status') — refusing to deploy."
              exit 1
            fi
            sleep 20
          done

  deploy-production:
    name: Deploy to Production
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # NOTE: This workflow deploys CODE ONLY. Database migrations are applied
      # MANUALLY (Supabase MCP) with explicit expand/contract ordering — see
      # .claude/rules/migration-safety.md. An earlier auto-migrate gate here
      # (drizzle-kit migrate, #683) is intentionally removed: it conflicted with
      # the manual-apply model (drifting the __drizzle_migrations ledger →
      # check_for_column_name_collision), so it FAILED on every run and silently
      # blocked all production deploys for ~2 weeks. It was also unsafe by design
      # for contract migrations (it ran migrate-FIRST, which would drop columns
      # the still-live old code reads). Drift protection now comes from the
      # expand/contract discipline (apply expand migrations BEFORE the dependent
      # code ships; apply contract migrations AFTER the new code is live), not
      # from a CI gate.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@50.23.2

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        # `vercel build` runs the monorepo build ON THIS RUNNER (4 vCPU / 16 GB)
        # — NOT in Vercel's build container.
        #
        # HISTORY: apps/web/vercel.json's buildCommand used to end in a bare
        # `pnpm build` -> `turbo run build` with no filter, so a *web* deploy
        # also compiled apps/admin — two concurrent `next build` processes. On
        # 2026-08-05 this step began aborting with "FATAL ERROR: Reached heap
        # limit Allocation failed" (exit 134), a clean V8 abort at Node 20's
        # default ~4 GB old-space cap, and blocked every deploy after 3fcc9939.
        # The stopgap was this 6144 ceiling.
        #
        # That buildCommand is now filtered (`--filter=@propertypro/web`), which
        # is the fix the previous note asked for: "this production deploy has no
        # reason to build apps/admin at all." apps/admin has its own deploy job
        # below, on its own runner, building only itself. So this step now runs
        # ONE `next build`, not two.
        #
        # The 6144 ceiling is retained deliberately. `vercel pull` supplies
        # SENTRY_AUTH_TOKEN (docs/DEPLOYMENT.md lists it "Build only"), which
        # un-gates Sentry source-map generation + upload — that is the other
        # half of why this step is heavier than CI's perf-check, which never
        # sets that token. One build at 6 GB has ample headroom on a 16 GB
        # runner; there is no longer a 2 x 6 GB = 12 GB constraint to respect.
        #
        # Still do NOT raise this to 8192 casually: NODE_OPTIONS is inherited by
        # every node process in the tree, and a ceiling above the runner's ~14 GB
        # usable RAM surfaces as SIGKILL (exit 137, no error text) rather than a
        # readable V8 abort.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          SMOKE_URL="${DEPLOY_URL%/}/auth/login"
          echo "Verifying deployment at $SMOKE_URL"
          BYPASS_HEADER=""
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS_HEADER="-H x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET"
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" $BYPASS_HEADER "$SMOKE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1

  # ---------------------------------------------------------------------------
  # apps/admin — the platform operator console (admin.getpropertypro.com).
  #
  # Until this job existed, apps/admin had NO deploy path from this workflow at
  # all: it reached production only via the native Vercel git integration, which
  # apps/admin/vercel.json's `ignoreCommand` gated on API-contract paths only.
  # Any commit touching admin pages, components, lib/ or middleware.ts produced
  # no deploy whatsoever — including auth and security changes.
  #
  # Runs in parallel with deploy-production (separate runner, separate Vercel
  # project, separate checkout, so no `.vercel/project.json` contention) and
  # shares the same Integration Tests gate.
  # ---------------------------------------------------------------------------
  deploy-admin:
    name: Deploy Admin to Production
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # Distinct project from web. `vercel pull/build/deploy` take no project
      # flag — they read this — so the two apps CANNOT share one id.
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Verify admin project is configured
        # Fail loudly rather than deploying admin into the WEB project, which is
        # what an unset id would silently do.
        run: |
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::VERCEL_PROJECT_ID_ADMIN is not set. Add the admin Vercel project id as a repository secret; see docs/DEPLOYMENT.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # As with web: CODE ONLY. Migrations are applied manually per
      # .claude/rules/migration-safety.md.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@50.23.2

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        # One `next build` (apps/admin/vercel.json filters turbo to this app).
        # Same 6144 ceiling as web, for the same reason: `vercel pull` supplies
        # SENTRY_AUTH_TOKEN, which un-gates Sentry source-map generation.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        # /api/health is the console's only unauthenticated route (see
        # apps/admin/src/middleware.ts PUBLIC_PATH_PREFIXES). Every other path
        # redirects to /auth/login, so this is the one endpoint that proves the
        # deployment actually booted rather than merely redirecting.
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          SMOKE_URL="${DEPLOY_URL%/}/api/health"
          echo "Verifying admin deployment at $SMOKE_URL"
          BYPASS_HEADER=""
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS_HEADER="-H x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET"
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" $BYPASS_HEADER "$SMOKE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1
