name: Deploy

on:
  # Production deploy only after CI passes on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # PR previews are handled by the native Vercel GitHub integration.

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Run pending DB migrations BEFORE shipping the new code, and gate the
      # deploy on their success. Migrations are additive (expand pattern), so
      # running them ahead of the code swap is safe: old code ignores new
      # columns/tables. This prevents the schema-drift class of outage where
      # Vercel ships code that selects columns the production DB doesn't have.
      # Requires the DIRECT_URL secret (direct 5432 connection) in the
      # `production` environment — drizzle.config.ts reads process.env.DIRECT_URL.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL secret is not set for the production environment."
            echo "Add it under Settings → Environments → production → secrets (direct 5432 connection)."
            exit 1
          fi
          pnpm --filter @propertypro/db db:migrate

      - name: Install Vercel CLI
        run: pnpm add -g vercel@50.23.2

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          SMOKE_URL="${DEPLOY_URL%/}/auth/login"
          echo "Verifying deployment at $SMOKE_URL"
          BYPASS_HEADER=""
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS_HEADER="-H x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET"
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" $BYPASS_HEADER "$SMOKE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1
