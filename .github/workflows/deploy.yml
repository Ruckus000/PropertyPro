name: Deploy

on:
  # Production deploy only after CI passes on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual trigger. Deploys are otherwise reachable ONLY by landing a commit on
  # main, which makes two ordinary operations awkward: applying a changed Vercel
  # env var (values are baked in at `vercel pull` + `vercel build`, so an existing
  # deployment never picks one up), and re-deploying after an infrastructure-only
  # fix. This repo has previously had production deploys silently blocked for two
  # weeks; not being able to deploy without inventing a commit is what made that
  # slow to recover from.
  workflow_dispatch:
  # PR previews are handled by the native Vercel GitHub integration.

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    # Auto: only when CI actually succeeded. Manual: the operator has decided,
    # and a dispatch carries no workflow_run conclusion to check — without this
    # second branch the dispatch trigger above would be accepted and then
    # silently skip every job.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # NOTE: This workflow deploys CODE ONLY. Database migrations are applied
      # MANUALLY (Supabase MCP) with explicit expand/contract ordering — see
      # .claude/rules/migration-safety.md. An earlier auto-migrate gate here
      # (drizzle-kit migrate, #683) is intentionally removed: it conflicted with
      # the manual-apply model (drifting the __drizzle_migrations ledger →
      # check_for_column_name_collision), so it FAILED on every run and silently
      # blocked all production deploys for ~2 weeks. It was also unsafe by design
      # for contract migrations (it ran migrate-FIRST, which would drop columns
      # the still-live old code reads). Drift protection now comes from the
      # expand/contract discipline (apply expand migrations BEFORE the dependent
      # code ships; apply contract migrations AFTER the new code is live), not
      # from a CI gate.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@50.23.2

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          SMOKE_URL="${DEPLOY_URL%/}/auth/login"
          echo "Verifying deployment at $SMOKE_URL"
          BYPASS_HEADER=""
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            BYPASS_HEADER="-H x-vercel-protection-bypass:$VERCEL_AUTOMATION_BYPASS_SECRET"
          fi
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" $BYPASS_HEADER "$SMOKE_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1
