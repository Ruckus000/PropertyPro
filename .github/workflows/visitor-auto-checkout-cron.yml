name: Visitor Auto Checkout

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled workflow: queue rather than overlap, so a slow run never stacks on
# the next tick. cancel-in-progress is false because these POST real work —
# killing one mid-flight is worse than making the next tick wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-visitor-auto-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke visitor auto-checkout route
        env:
          VISITOR_AUTO_CHECKOUT_CRON_BASE_URL: ${{ secrets.VISITOR_AUTO_CHECKOUT_CRON_BASE_URL }}
          VISITOR_AUTO_CHECKOUT_CRON_SECRET: ${{ secrets.VISITOR_AUTO_CHECKOUT_CRON_SECRET }}
        run: |
          if [ -z "$VISITOR_AUTO_CHECKOUT_CRON_BASE_URL" ] || [ -z "$VISITOR_AUTO_CHECKOUT_CRON_SECRET" ]; then
            echo "::warning::Skipping visitor auto-checkout because required secrets are not configured"
            exit 0
          fi

          # --max-time bounds a hung endpoint (there is no default timeout);
          # --retry covers a transient 5xx or dropped connection.
          curl -fsS \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            -X POST \
            "$VISITOR_AUTO_CHECKOUT_CRON_BASE_URL/api/v1/internal/visitor-auto-checkout" \
            -H "Authorization: Bearer $VISITOR_AUTO_CHECKOUT_CRON_SECRET" \
            -H "Content-Type: application/json"
