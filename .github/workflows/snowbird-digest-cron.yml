name: Snowbird Digest Processor

# Hourly. The processor self-gates on 8 AM community-local time, so an hourly
# cadence just guarantees each community's send window is hit.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled workflow: queue rather than overlap, so a slow run never stacks on
# the next tick. cancel-in-progress is false because these POST real work —
# killing one mid-flight is worse than making the next tick wait.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-snowbird-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke snowbird digest processor route
        env:
          DIGEST_CRON_BASE_URL: ${{ secrets.DIGEST_CRON_BASE_URL }}
          SNOWBIRD_DIGEST_CRON_SECRET: ${{ secrets.SNOWBIRD_DIGEST_CRON_SECRET }}
        run: |
          if [ -z "$DIGEST_CRON_BASE_URL" ]; then
            echo "Missing DIGEST_CRON_BASE_URL secret"
            exit 1
          fi

          if [ -z "$SNOWBIRD_DIGEST_CRON_SECRET" ]; then
            echo "Missing SNOWBIRD_DIGEST_CRON_SECRET secret"
            exit 1
          fi

          # --max-time bounds a hung endpoint (there is no default timeout);
          # --retry covers a transient 5xx or dropped connection.
          curl -fsS \
            --max-time 120 \
            --retry 3 \
            --retry-delay 10 \
            --retry-connrefused \
            -X POST \
            "$DIGEST_CRON_BASE_URL/api/v1/internal/snowbird-digest" \
            -H "Authorization: Bearer $SNOWBIRD_DIGEST_CRON_SECRET" \
            -H "Content-Type: application/json"
