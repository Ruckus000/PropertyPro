name: Postgres Image Digest Bump

# The Postgres service image is pinned by digest in scripts/ci/postgres-image-digest,
# which integration-tests.yml and tenant-isolation-game-day.yml read through a
# `pin` job. A pin with no bump process is a pin that rots:
# it silently freezes the Postgres patch level, including security patches, until
# somebody happens to notice. This job is that process.
#
# Weekly it resolves what `postgres:16` currently points at on the ECR Public
# mirror and, if that differs from what is pinned, copies the new digest into
# this repo's GHCR package (where the consumers actually pull from — see
# ci-image-mirror.yml) and opens a PR moving the pin. The mirror step MUST
# precede the PR: the PR's integration-tests pulls the new digest from GHCR, and
# a push made with GITHUB_TOKEN does not trigger ci-image-mirror.yml.
#
# Why the digest is NOT written in the workflow files: GITHUB_TOKEN can never be
# granted the `workflows` permission, so GitHub rejects any push of it that
# touches .github/workflows/. With the pin there, every run that found a new
# digest failed at `git push` (9 Mondays in a row, 2026-08-10 → 2026-10-05) and
# no bump PR was ever opened. A plain file outside .github/ needs no secret.

on:
  schedule:
    # Mondays 06:00 UTC — ahead of the working week, and before the
    # tenant-isolation game day at 09:30 which uses the same image.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    name: bump-postgres-digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed to push the bump branch and open the PR. Deliberately scoped to
      # this job rather than the workflow, and nothing wider than these three.
      contents: write
      pull-requests: write
      # Copy the new digest into ghcr.io/<owner>/postgres before proposing it.
      packages: write

    env:
      IMAGE_REPO: docker/library/postgres
      IMAGE_TAG: '16'
      REGISTRY: public.ecr.aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the current digest for the tag
        id: resolve
        run: |
          set -euo pipefail

          token=$(curl -fsS \
            "https://${REGISTRY}/token/?scope=repository:${IMAGE_REPO}:pull&service=${REGISTRY}" \
            | jq -r .token)

          # The tag points at an OCI image INDEX (multi-arch). Pinning the index
          # digest is what preserves multi-arch resolution — pinning a per-platform
          # manifest would break any runner on a different architecture.
          latest=$(curl -fsSI \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://${REGISTRY}/v2/${IMAGE_REPO}/manifests/${IMAGE_TAG}" \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')

          # Fail closed. Writing an unvalidated string into the pin would be
          # worse than not bumping at all — a malformed pin breaks every job
          # that uses the image, including the production-deploy gate.
          if ! printf '%s' "$latest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Registry did not return a usable digest (got: '${latest:-<empty>}')"
            exit 1
          fi

          current=$(tr -d '[:space:]' < scripts/ci/postgres-image-digest)
          if ! printf '%s' "$current" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error file=scripts/ci/postgres-image-digest::Not a sha256 digest: '${current}'"
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pin is current ($current)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Pin is stale: $current -> $latest"
          fi

      - name: Mirror the new digest to GHCR
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          dest_repo="ghcr.io/${OWNER,,}/postgres"
          hex="${LATEST#sha256:}"
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GH_ACTOR" --password-stdin
          # --preserve-digests: the GHCR index must be byte-identical to
          # upstream's, or the pin we are about to write would not resolve.
          skopeo copy --all --preserve-digests --retry-times 3 \
            "docker://${REGISTRY}/${IMAGE_REPO}@${LATEST}" \
            "docker://${dest_repo}:${IMAGE_TAG}-${hex:0:12}"
          got="sha256:$(skopeo inspect --raw "docker://${dest_repo}@${LATEST}" | sha256sum | cut -d' ' -f1)"
          if [ "$got" != "$LATEST" ]; then
            echo "::error::GHCR returned ${got} for ${LATEST} — not opening a PR"
            exit 1
          fi
          echo "Verified: ${dest_repo}@${LATEST}"

      - name: Open a bump PR
        if: steps.resolve.outputs.changed == 'true'
        env:
          # GITHUB_TOKEN, deliberately — no secret to create, rotate or expire.
          # The trade: a PR it opens does NOT trigger other workflows (GitHub
          # suppresses that to prevent recursion), so the PR's checks never
          # report until a human closes and reopens it. The PR body says so.
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.resolve.outputs.current }}
          LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail

          short="${LATEST#sha256:}"; short="${short:0:12}"
          branch="chore/postgres-digest-${short}"

          # Deterministic branch name, so a digest that stays stale for several
          # weeks produces ONE PR rather than one per run.
          if gh pr list --head "$branch" --state open --json number \
              --jq 'length' | grep -qv '^0$'; then
            echo "A PR for $branch is already open — nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          # The one pin both consumers read; nothing under .github/workflows/
          # changes, which is what lets GITHUB_TOKEN push this.
          printf '%s\n' "$LATEST" > scripts/ci/postgres-image-digest
          git add scripts/ci/postgres-image-digest

          # Separate -m flags rather than one multi-line string: every line in a
          # YAML block scalar must stay indented, and a column-0 continuation
          # silently ends the block and breaks the whole workflow file.
          git commit \
            -m "chore(ci): bump pinned postgres:16 digest" \
            -m "${CURRENT} -> ${LATEST}" \
            -m "Opened automatically by .github/workflows/postgres-digest-bump.yml. The tag still resolves to postgres:16 on the ECR Public mirror; only the digest moved, which is how upstream ships patch releases. The new digest was copied to this repo's GHCR package before this commit."

          git push origin "$branch"

          {
            printf 'Automated digest bump for the Postgres service container.\n\n'
            printf '| | |\n|---|---|\n'
            printf '| From | `%s` |\n' "$CURRENT"
            printf '| To | `%s` |\n\n' "$LATEST"
            printf '`postgres:16` on the ECR Public mirror now resolves to a new image\n'
            printf 'index — that is how upstream ships patch releases. The tag is\n'
            printf 'unchanged; only the pin moves. The new digest has already been\n'
            printf 'copied (digest-preserving) into the GHCR package, which is\n'
            printf 'where the service containers pull from.\n\n'
            printf 'Merging is safe once `integration-tests` is green, since that job is\n'
            printf 'the primary consumer of this image and will pull the new digest.\n'
            printf '\n> **CI will not start on its own.** This PR was opened with\n'
            printf '> `GITHUB_TOKEN`, and GitHub suppresses workflow triggers for such\n'
            printf '> PRs. Close and reopen it to run the checks.\n'
          } > /tmp/bump-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(ci): bump pinned postgres:16 digest to ${short}" \
            --body-file /tmp/bump-body.md
