name: Scoped DB Access Guard

on:
  pull_request:
    paths:
      - apps/web/src/**
      - packages/db/src/**
      - scripts/verify-scoped-db-access.ts
      - package.json
      - pnpm-lock.yaml
  # Only re-run on pushes to main (post-merge). Feature-branch pushes are
  # already covered by the pull_request trigger, so an unfiltered push trigger
  # just doubled every guard run on the same commit (INF-04).
  push:
    branches: [main]
    paths:
      - apps/web/src/**
      - packages/db/src/**
      - scripts/verify-scoped-db-access.ts
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: scoped-db-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-scoped-db-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify scoped DB access guard
        run: pnpm guard:db-access
