name: Nightly Demo Reset

on:
  schedule:
    # 03:17 UTC = 11:17 PM EDT / 10:17 PM EST. GitHub starts scheduled runs
    # late: 4-7 hours in Oct 2026 (the old '0 8 * * *' ran at 8-11:30 AM ET,
    # resetting demo data in business hours). Starting earlier absorbs that
    # delay, and :17 avoids the congested top of the hour. No start time is
    # guaranteed; if it must finish before a given hour, trigger it another way.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reset-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run demo reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMO_DEFAULT_PASSWORD: ${{ secrets.DEMO_DEFAULT_PASSWORD }}
          PROPERTYPRO_SEED_ENV: demo-nightly
        run: pnpm reset:demo

      # Surface failures: this workflow ran silently broken for ~4 months. On any
      # failure (including earlier steps like install), open or update a single
      # tracking issue so the breakage is visible instead of buried in run history.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly Demo Reset failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The **Nightly Demo Reset** workflow failed.\n\n- Run: ${runUrl}\n- Commit: ${context.sha}\n\nThe demo communities were not reseeded. Investigate before the next nightly run.`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find((i) => !i.pull_request && i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
